<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Flashcards & Auto-Battle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 布局容器 */
        .layout-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 95%;
            max-width: 1440px;
            gap: 50px;
            padding: 40px 0;
        }

        .container {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        /* 增大卡片尺寸 */
        .card {
            background: #1e293b;
            min-height: 560px; /* 原700px的80% */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0px !important; /* 彻底直角图片框 */
            border: 8px solid #f97316; 
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            padding: 20px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.97);
        }
        /* 增大单词文字 - 初始状态 */
        .filename {
            font-size: 10rem;
            font-weight: 900;
            letter-spacing: -4px;
            white-space: nowrap; /* 强制单行显示 */
            pointer-events: none;
            line-height: 1;
            text-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transition: font-size 0.1s ease-out;
        }
        /* 直角图片：缩小图片大小至大致原来比例的80% (650px -> 520px) */
        #displayImage {
            max-width: 100%;
            max-height: 520px;
            border-radius: 0px !important; /* 彻底直角 */
            display: none;
            object-fit: contain;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* 缩小“下一个”快捷悬浮按键 */
        .floating-next-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: 2px solid #ffedd5;
            padding: 10px 20px;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-next-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 12px 28px rgba(249, 115, 22, 0.7);
            background: linear-gradient(135deg, #fb923c, #f97316);
        }
        .floating-next-btn:active {
            transform: scale(0.95);
        }

        /* 右侧控制栏：包含按钮和小地图战场 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
            position: sticky;
            top: 40px;
            flex-shrink: 0;
        }

        /* 小地图自动战斗面板 */
        .mini-map-box {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            padding: 18px;
            border-radius: 28px;
            border: 3px solid rgba(249, 115, 22, 0.6);
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .mini-map-box:hover {
            border-color: #f97316;
            box-shadow: 0 20px 45px rgba(249, 115, 22, 0.3);
        }
        .mini-map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.15rem;
            font-weight: 900;
            color: #f97316;
            letter-spacing: 0.5px;
        }
        .mini-map-header span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .battle-canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
            background: #020617;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #battleCanvas {
            width: 100%;
            height: 220px;
            display: block;
        }
        .base-hp-bars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
            font-size: 0.72rem;
            font-weight: bold;
        }
        .hp-bar-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }
        .hp-bar-container.enemy {
            text-align: right;
        }
        .hp-bar-container.tower {
            text-align: center;
        }
        .hp-bar-bg {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .hp-bar-fill-ally {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.3s ease;
        }
        .hp-bar-fill-ally-tower {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s ease;
        }
        .hp-bar-fill-tower {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            transition: width 0.3s ease;
        }
        .hp-bar-fill-enemy {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            transition: width 0.3s ease;
        }
        .spawn-progress-container {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px 12px;
            text-align: left;
        }
        .spawn-progress-title {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .spawn-progress-bar-bg {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }
        .spawn-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f97316, #fb923c);
            transition: width 0.2s ease;
        }
        .battle-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(30, 41, 59, 0.5);
            padding: 6px 10px;
            border-radius: 10px;
            font-weight: 600;
        }
        .battle-btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-mini {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-mini-restart {
            background: #334155;
        }
        .btn-mini-restart:hover {
            background: #475569;
        }
        .btn-mini-test {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }
        .btn-mini-test:hover {
            filter: brightness(1.1);
        }

        .btn {
            padding: 22px 25px; 
            background: #f97316;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            font-size: 1.4rem; 
            box-shadow: 0 12px 24px -5px rgba(249, 115, 22, 0.4);
            transition: all 0.2s;
            text-align: center;
        }
        .btn-secondary {
            background: #334155;
            box-shadow: 0 12px 24px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-random {
            background: #8b5cf6;
            box-shadow: 0 12px 24px -5px rgba(139, 92, 246, 0.4);
            display: block;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-next-main {
            font-size: 1.4rem;
            padding: 14px 40px;
            width: 85%;
            max-width: 380px;
            border-radius: 35px;
            margin-top: 15px;
            box-shadow: 0 8px 20px -5px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease-in-out;
            border: 2px solid #ff7a1c;
        }
        .btn-next-main:hover {
            box-shadow: 0 12px 25px -5px rgba(249, 115, 22, 0.7);
            transform: scale(1.02);
        }
        
        .progress-hint {
            margin-top: 18px;
            font-size: 1.2rem;
            color: #ff7a1c;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        
        .tip {
            margin-top: 18px;
            opacity: 0.6;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            color: #94a3b8;
        }
        .key-hint {
            display: block;
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.7;
            font-weight: normal;
        }

        #error {
            color: #fb7185;
            display: none;
            flex-direction: column;
            gap: 20px;
            font-size: 1.5rem;
        }

        /* iPad 与 平板屏幕优化 (768px ~ 1180px)：左右并排，同时看背词与游戏界面 */
        @media (min-width: 768px) and (max-width: 1180px) {
            .layout-wrapper {
                flex-direction: row !important;
                align-items: flex-start;
                gap: 20px;
                width: 98%;
                padding: 15px 0;
            }
            .container {
                flex: 1;
                min-width: 0;
            }
            .card {
                min-height: 440px;
                padding: 15px;
            }
            #displayImage {
                max-height: 380px;
            }
            .controls {
                width: 320px;
                position: sticky;
                top: 15px;
            }
            .btn-next-main {
                font-size: 1.3rem;
                padding: 12px 30px;
            }
        }

        /* 手机横屏优化 (Mobile Landscape)：左右双栏布局，同时可见背词卡片与游戏 */
        @media (max-height: 550px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                overflow-y: auto;
            }
            .layout-wrapper {
                flex-direction: row !important;
                align-items: flex-start;
                gap: 15px;
                width: 98%;
                padding: 8px 0;
            }
            .container {
                flex: 1;
                min-width: 0;
            }
            .card {
                min-height: 240px;
                padding: 10px;
                border-width: 4px;
            }
            .filename {
                font-size: 3.5rem;
            }
            #displayImage {
                max-height: 180px;
            }
            .btn-next-main {
                font-size: 1.1rem;
                padding: 8px 20px;
                margin-top: 8px;
                max-width: 260px;
            }
            .controls {
                width: 280px;
                position: static;
                gap: 8px;
            }
            #battleCanvas {
                height: 150px;
            }
            .floating-next-btn {
                padding: 6px 14px;
                font-size: 0.9rem;
                bottom: 10px;
                right: 10px;
            }
        }

        /* 手机竖屏优化 */
        @media (max-width: 767px) and (orientation: portrait) {
            .layout-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 10px 0;
                width: 100%;
            }
            .container {
                padding: 0 10px;
            }
            .filename { 
                font-size: 5rem; 
            }
            .card { 
                min-height: 320px; 
                padding: 12px; 
                margin-top: 5px;
                border-radius: 0px !important;
                border-width: 6px;
            }
            .btn { 
                font-size: 1rem; 
                padding: 12px 8px;
                min-width: 0;
                flex: 1 1 30%;
                border-radius: 16px;
            }
            .btn-next-main {
                font-size: 1.3rem;
                padding: 12px 24px;
                min-width: 90%;
                width: 90%;
                border-radius: 30px;
                margin-top: 15px;
            }
            .controls {
                padding: 0 10px;
                gap: 8px;
                width: 100%;
            }
            .mini-map-box { 
                order: -1; 
                padding: 12px;
                border-radius: 20px;
            }
            #displayImage {
                max-height: 280px; /* 原380px缩小至大致80% */
            }
            .floating-next-btn {
                padding: 8px 16px;
                font-size: 0.95rem;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <!-- 屏幕右下角悬浮快捷按钮组 -->
    <div style="position: fixed; bottom: 15px; right: 15px; z-index: 1000; display: flex; gap: 8px;">
        <button class="floating-next-btn" style="background: linear-gradient(135deg, #334155, #1e293b); border: 2px solid #ef4444; color: #fca5a5; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);" onclick="dontKnowWord()" title="未记住，将在约20词后再次复现">
            🤔 不知道
        </button>
        <button class="floating-next-btn" onclick="nextWord()" title="快捷下一个">
            下一个 ➔
        </button>
    </div>

    <!-- 🏰 城堡防御与科技树研习弹窗 (每背 5 个单词获得 1 点科技/建造点) -->
    <div id="buildModal" style="display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.94); backdrop-filter: blur(16px); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: #0f172a; border: 3px solid #f97316; border-radius: 24px; padding: 22px; max-width: 860px; width: 95%; max-height: 88vh; overflow-y: auto; box-shadow: 0 25px 60px -10px rgba(249, 115, 22, 0.5); color: white; position: relative;">
            <button onclick="closeBuildModal()" style="position: absolute; top: 16px; right: 18px; background: #334155; border: none; color: white; font-size: 1.2rem; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-weight: bold; z-index: 10;">✕</button>
            
            <div style="font-size: 1.8rem; font-weight: 900; color: #f97316; margin-bottom: 2px; text-align: center; text-shadow: 0 0 12px rgba(249, 115, 22, 0.6);">🌳 城堡军事科技树 - 研习与防线部署</div>
            <div style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 14px; text-align: center;">每复习 5 个单词获得 1 点科技/建造点 | 可用点数: <b id="modalPointsBadge" style="color: #fde047; font-size: 1.3rem;">0</b></div>

            <!-- 科技树分支切换 Filter Tabs -->
            <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
                <button onclick="setTechBranchFilter('all')" class="tech-tab-btn" id="tabBtn-all" style="background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.82rem; cursor: pointer;">🌳 全部分支</button>
                <button onclick="setTechBranchFilter('armor')" class="tech-tab-btn" id="tabBtn-armor" style="background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.82rem; cursor: pointer;">🛡️ 铠甲与城防</button>
                <button onclick="setTechBranchFilter('archery')" class="tech-tab-btn" id="tabBtn-archery" style="background: #1e293b; color: #fde047; border: 1px solid #fde047; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.82rem; cursor: pointer;">🏹 弓弩与长弓手</button>
                <button onclick="setTechBranchFilter('siege')" class="tech-tab-btn" id="tabBtn-siege" style="background: #1e293b; color: #f97316; border: 1px solid #f97316; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.82rem; cursor: pointer;">💥 攻城与机关</button>
            </div>

            <div id="defenseOptionsList" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- 动态生成树状科技树卡片结构 -->
            </div>

            <div style="margin-top: 18px; text-align: center;">
                <button onclick="closeBuildModal()" style="background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; padding: 10px 30px; font-size: 1rem; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(249,115,22,0.4);">确定并返回战场</button>
            </div>
        </div>
    </div>

    <!-- 👑 三国英雄召集弹窗 (每背 30 个单词触发 1 次) -->
    <div id="heroModal" style="display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.94); backdrop-filter: blur(16px); z-index: 10000; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: linear-gradient(180deg, #1e1b4b, #0f172a); border: 3px solid #fde047; border-radius: 24px; padding: 22px; max-width: 580px; width: 95%; box-shadow: 0 25px 60px -10px rgba(250, 204, 21, 0.5); color: white; position: relative; text-align: center;">
            <div style="font-size: 1.8rem; font-weight: 900; color: #fde047; margin-bottom: 4px; text-shadow: 0 0 16px rgba(250, 204, 21, 0.8);">👑 三国名将领命降临！</div>
            <div style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 18px;">已累计复习 <b id="heroModalWordCount" style="color: #fde047; font-size: 1.1rem;">30</b> 个单词！请招募一位三国英雄驻守城墙：</div>

            <div id="heroSelectionCards" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px;">
                <!-- 动态产生 1个近战 + 1个远程 三国英雄卡片 -->
            </div>
        </div>
    </div>

    <div class="layout-wrapper">
        <div class="container">
            <div class="card" id="mainCard" onclick="handleCardClick()">
                <div id="textLabel" class="filename">READY</div>
                <img id="displayImage" src="" alt="Card Image">
                <div id="error">
                    <span>图片读取失败</span>
                </div>
            </div>
            
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; margin-top: 10px;">
                <button id="nextBtn" class="btn btn-next-main" style="flex: 1; max-width: 200px; margin-top: 0;" onclick="nextWord()">
                    下一个 ➔
                    <span class="key-hint">Enter</span>
                </button>
                <button id="dontKnowBtn" class="btn btn-next-main" style="flex: 1; max-width: 180px; margin-top: 0; background: linear-gradient(135deg, #334155, #1e293b); border: 2px solid #ef4444; color: #fca5a5; box-shadow: 0 8px 20px -5px rgba(239, 68, 68, 0.4);" onclick="dontKnowWord()" title="没记住该词，将在约20个单词后再次出现">
                    🤔 不知道
                </button>
            </div>

            <!-- 进度显示 -->
            <div class="progress-hint">
                第 <span id="currentWordNum">0</span> / <span id="totalWordNum">0</span> 个单词 (<span id="progressPercentage">0</span>%)
            </div>

            <p class="tip">快捷键：[空格] 翻转卡片 | [回车] 下一个/随机单词</p>
        </div>

        <div class="controls">
            <!-- 🏰 城堡塔防游戏面板 -->
            <div class="mini-map-box">
                <div class="mini-map-header">
                    <span>🏰 城堡防守战</span>
                    <span id="waveBadge" style="font-size: 0.75rem; color: #fb7185; background: #331f28; padding: 2px 8px; border-radius: 10px;">⏱️ 第 1 波敌军</span>
                </div>

                <!-- 城堡血条与防御解锁状态 -->
                <div class="base-hp-bars">
                    <div class="hp-bar-container">
                        <span style="color: #10b981;">🏰 城堡城墙耐久 <span id="castleHpText">10000/10000</span></span>
                        <div class="hp-bar-bg">
                            <div id="castleHpBar" class="hp-bar-fill-ally"></div>
                        </div>
                    </div>
                    <div id="activeDefenseBadges" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 0.72rem; color: #cbd5e1; margin-top: 3px;">
                        <!-- 动态解锁的防御设施徽章 -->
                    </div>
                </div>

                <!-- 战斗 Canvas 画布 -->
                <div class="battle-canvas-wrapper">
                    <canvas id="battleCanvas"></canvas>
                </div>

                <!-- 复习 5 词升级进度条 & 30 词三国神将进度条 -->
                <div class="spawn-progress-container">
                    <div class="spawn-progress-title">
                        <span>🧱 城堡建设 (每 5 词 +1 点)</span>
                        <span id="buildProgressText" style="color: #f97316;">0/5 词</span>
                    </div>
                    <div class="spawn-progress-bar-bg">
                        <div id="buildProgressBar" class="spawn-progress-bar-fill"></div>
                    </div>

        async function loadDynamicImages() {
            let owner = "u3823433669-ui";
            let repo = "palabarjuego"; // 优先匹配当前新建立的仓库

            const hostname = window.location.hostname;
            const pathname = window.location.pathname;

            // 智能分析当前访问的 github pages 仓库所有者和仓库名
            if (hostname.endsWith('.github.io')) {
                owner = hostname.replace('.github.io', '');
                const pathParts = pathname.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    repo = pathParts[0];
                }
            }

            // 尝试读取 Edibujar（大写首字母）或 edibujar（全小写）
            const folderCandidates = ["Edibujar", "edibujar"];
            for (const folder of folderCandidates) {
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;
                console.log(`正在尝试从 GitHub API 加载 [${folder}] 文件夹:`, apiUrl);

                try {
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        if (Array.isArray(data)) {
                            const validExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
                            const fetchedImages = data
                                .filter(file => file.type === 'file' && validExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
                                .map(file => file.name);
                            
                            if (fetchedImages.length > 0) {
                                images = fetchedImages;
                                imageFolderPath = folder + "/";
                                console.log(`🎉 成功从 GitHub [${folder}] 动态加载到 ${images.length} 个图片:`, images);
                                break;
                            }
                        }
                    }
                } catch (error) {
                    console.warn(`从 ${folder} 加载失败:`, error);
                }
            }
        }

        let currentIndex = -1;
        let isRevealed = false;
        let lastActionWasRandom = false;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let isSwiped = false;

        // 核心优化：超大显眼字号与智能防超框微调
        function fitText(el) {
            if (!el || !el.parentElement) return;
            const container = el.parentElement;
            const style = window.getComputedStyle(container);
            const paddingLeft = parseFloat(style.paddingLeft) || 15;
            const paddingRight = parseFloat(style.paddingRight) || 15;
            const maxWidth = Math.max(100, container.clientWidth - paddingLeft - paddingRight);
            
            // 显著增大字号（桌面端 120px / 移动端 64px）
            let fontSize = window.innerWidth <= 600 ? 64 : 120; 
            el.style.fontSize = fontSize + 'px';
            
            // 仅对极个别超长单词微调缩小，保证清晰巨型大字
            while (el.offsetWidth > maxWidth && fontSize > 28) {
                fontSize -= 2;
                el.style.fontSize = fontSize + 'px';
            }
        }

        function updateDisplay() {
            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const errorElement = document.getElementById('error');
            const card = document.getElementById('mainCard');
            
            if (currentIndex === -1) return;
            
            const fileName = images[currentIndex];
            const displayName = fileName.split('.')[0];
            const fullPath = imageFolderPath + fileName + "?v=" + new Date().getTime();

            isRevealed = false;
            imgElement.style.display = 'none';
            textLabel.innerText = displayName;
            textLabel.style.display = 'block';
            errorElement.style.display = 'none';
            card.style.backgroundColor = '#1e293b';

            // 更新进度 UI
            const totalCount = images.length;
            const currentNum = currentIndex + 1;
            const progressPct = totalCount > 0 ? Math.round((currentNum / totalCount) * 100) : 0;
            
            document.getElementById('currentWordNum').innerText = currentNum;
            document.getElementById('totalWordNum').innerText = totalCount;
            document.getElementById('progressPercentage').innerText = progressPct;

            // 设置文字后立即调用缩放函数
            fitText(textLabel);

            // 预加载图片（增加多途径备用容错，如大小写切换）
            imgElement.src = fullPath;
            imgElement.onload = function() {
                console.log('Preloaded success: ' + fullPath);
            };
            imgElement.onerror = function() {
                console.warn('Preload failed for: ' + fullPath + ', trying alternate casing...');
                // 自动尝试大小写容错路径
                const altFolder = imageFolderPath.startsWith("Edibujar") ? "edibujar/" : "Edibujar/";
                const altPath = altFolder + fileName;
                
                // 如果备用路径成功，更新当前使用的路径
                const tempImg = new Image();
                tempImg.src = altPath;
                tempImg.onload = function() {
                    imageFolderPath = altFolder;
                    imgElement.src = altPath;
                };
            };
        }

        function next20Words() {
            lastActionWasRandom = false;
            if (images.length === 0) return;
            if (currentIndex === -1) {
                currentIndex = 19 % images.length;
            } else {
                currentIndex = (currentIndex + 20) % images.length;
            }
            updateDisplay();
            recordWordReview(20);
        }

        function nextWord() {
            lastActionWasRandom = false;
            currentIndex = (currentIndex + 1) % images.length;
            updateDisplay();
            recordWordReview(1);
        }

        function dontKnowWord() {
            lastActionWasRandom = false;
            if (images.length === 0) return;
            if (currentIndex < 0) currentIndex = 0;

            const forgottenWord = images[currentIndex];
            // 没记住的单词，在约20个单词后面重新出现
            const targetOffset = 20;
            const targetIdx = Math.min(images.length, currentIndex + targetOffset);
            images.splice(targetIdx, 0, forgottenWord);

            // 切换到下一个单词
            currentIndex = (currentIndex + 1) % images.length;
            updateDisplay();

            // 飘字提示，不计入已背单词数 (未计入 recordWordReview)
            const notifyX = (typeof tdState !== 'undefined' && tdState && tdState.castle) ? tdState.castle.x + 80 : 120;
            if (typeof addFloatingText === 'function') {
                addFloatingText(notifyX, 40, "🤔 记入错题集，20词后再次复习", "#fca5a5");
            }
        }

        function prevWord() {
            lastActionWasRandom = false;
            if (currentIndex <= 0) {
                currentIndex = images.length - 1;
            } else {
                currentIndex--;
            }
            updateDisplay();
            recordWordReview(1);
        }

        function randomWord() {
            lastActionWasRandom = true;
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * images.length);
            } while (newIndex === currentIndex && images.length > 1);
            
            currentIndex = newIndex;
            updateDisplay();
            recordWordReview(1);
        }

        function handleCardClick() {
            if (isSwiped) {
                isSwiped = false;
                return;
            }
            if (isRevealed) {
                updateDisplay();
            } else {
                revealImage();
            }
        }

        // 绑定触屏手势进行左右滑动切换
        const mainCard = document.getElementById('mainCard');
        mainCard.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
            isSwiped = false;
        }, { passive: true });

        mainCard.addEventListener('touchmove', function(event) {
            const currentX = event.changedTouches[0].screenX;
            const currentY = event.changedTouches[0].screenY;
            const diffX = touchStartX - currentX;
            const diffY = Math.abs(touchStartY - currentY);
            
            // 如果位移过大，说明是滑动，避免松手时触发 handleCardClick 的翻转
            if (Math.abs(diffX) > 15 || diffY > 15) {
                isSwiped = true;
            }
        }, { passive: true });

        mainCard.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            // 左滑 -> 下一个 (阈值为 50 像素，且水平偏移大于垂直偏移)
            if (diffX > 50 && diffY < diffX) {
                nextWord();
            } 
            // 右滑 -> 前一张
            else if (diffX < -50 && diffY < Math.abs(diffX)) {
                prevWord();
            }
        }, { passive: true });

        function revealImage() {
            if (currentIndex === -1) return;

            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const card = document.getElementById('mainCard');
            const errorElement = document.getElementById('error');

            if (imgElement.complete && imgElement.naturalHeight === 0) {
                errorElement.style.display = 'flex';
                textLabel.style.display = 'none';
            } else {
                textLabel.style.display = 'none';
                imgElement.style.display = 'block';
                card.style.backgroundColor = '#0f172a';
            }
            isRevealed = true;
        }

        // 键盘监听
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                handleCardClick();
            } else if (e.code === 'Enter') {
                if (lastActionWasRandom) {
                    randomWord();
                } else {
                    nextWord();
                }
            }
        });

        // 监听窗口大小变化以重新调整字体与画布
        window.addEventListener('resize', () => {
            const textLabel = document.getElementById('textLabel');
            if (textLabel.style.display !== 'none') {
                fitText(textLabel);

            if (canvas) {
                setupCanvasDimensions();

        // 记录复习单词
        function recordWordReview(count = 1) {
            tdState.wordCount += count;
            tdState.wordsProgress += count;
            tdState.heroWordsProgress += count;

            // 1. 每复习 5 个单词获得 1 点建造/科技升级点
            if (tdState.wordsProgress >= 5) {
                const earnedPoints = Math.floor(tdState.wordsProgress / 5);
                tdState.wordsProgress %= 5;
                tdState.buildPoints += earnedPoints;

                // 获得建造点飘字与特效
                addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🎉 背完5词! 获得${earnedPoints}点科技/建造点!`, "#fde047");
                addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#fde047", 20);

                // 自动弹出升级建造界面
                setTimeout(() => {
                    openBuildModal();
                }, 300);
            }

            // 2. 每复习 30 个单词召唤三国神将
            if (tdState.heroWordsProgress >= 30) {
                const earnedHeroes = Math.floor(tdState.heroWordsProgress / 30);
                tdState.heroWordsProgress %= 30;
                tdState.pendingHeroChoices += earnedHeroes;

                setTimeout(() => {
                    triggerHeroModal();
                }, 600);
            }

            updateBattleUI();
        }

        // 渲染树状科技树弹窗
        function renderTechTreeModal() {
            const badge = document.getElementById('modalPointsBadge');
            if (badge) badge.innerText = tdState.buildPoints;

            const listEl = document.getElementById('defenseOptionsList');
            if (!listEl) return;

            const branchDefs = [
                { id: 'armor', title: '🛡️ 城堡与铠甲分支', color: '#38bdf8', items: ['armor1', 'armor2', 'moat', 'chevalDeFrise'] },
                { id: 'archery', title: '🏹 远射与弓弩分支', color: '#fde047', items: ['archery', 'leftTower', 'centerTower', 'rightTower', 'crossbow', 'wallArchers'] },
                { id: 'siege', title: '💥 攻城与机关分支', color: '#f97316', items: ['traps', 'pitfall', 'boilingOil', 'rollingLog', 'catapult', 'ballista'] }
            ];

            const activeBranches = currentTechBranchFilter === 'all' 
                ? branchDefs 
                : branchDefs.filter(b => b.id === currentTechBranchFilter);

            let html = '';

            for (let branch of activeBranches) {
                html += `
                    <div style="background: rgba(15, 23, 42, 0.75); border: 2px solid ${branch.color}50; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);">
                        <div style="font-size: 1.15rem; font-weight: 900; color: ${branch.color}; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
                            <span>${branch.title}</span>
                            <span style="font-size: 0.75rem; color: #94a3b8; font-weight: normal;">依赖关系：顶端节点 ➔ 派生解锁</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                `;

                for (let i = 0; i < branch.items.length; i++) {
                    const key = branch.items[i];
                    const def = techNodes.find(n => n.key === key);
                    if (!def) continue;

                    const item = tdState.defenses[key];
                    if (!item) continue;

                    // 检查前置科技是否满足
                    const prereqMet = !def.prereq || (tdState.defenses[def.prereq] && tdState.defenses[def.prereq].level > 0);
                    const isMax = item.level >= item.maxLevel;
                    const canAfford = tdState.buildPoints > 0 && prereqMet && !isMax;

                    let borderStyle = 'border: 1px solid #334155;';
                    let bgStyle = 'background: #1e293b;';
                    let badgeHtml = '';

                    if (!prereqMet) {
                        bgStyle = 'background: #0f172a; opacity: 0.65;';
                        borderStyle = 'border: 1px dashed #f43f5e;';
                        badgeHtml = `<span style="color: #f43f5e; font-size: 0.78rem; font-weight: bold; background: #881337; padding: 2px 8px; border-radius: 10px;">🔒 需要先解锁: ${def.prereqName}</span>`;
                    } else if (item.level > 0) {
                        bgStyle = 'background: linear-gradient(135deg, #1e293b, #0f172a);';
                        borderStyle = `border: 1.5px solid ${branch.color}; box-shadow: 0 4px 14px ${branch.color}30;`;
                        badgeHtml = `<span style="color: #fde047; font-size: 0.85rem; font-weight: bold; background: #713f12; padding: 2px 8px; border-radius: 10px;">Lv.${item.level}/${item.maxLevel}</span>`;
                    } else {
                        badgeHtml = `<span style="color: #a855f7; font-size: 0.78rem; font-weight: bold; background: #3b0764; padding: 2px 8px; border-radius: 10px;">⚡ 可解锁</span>`;
                    }

                    let connArrow = '';
                    if (def.prereq) {
                        connArrow = `<div style="text-align: left; padding-left: 14px; color: #64748b; font-size: 0.8rem; margin-top: -6px; margin-bottom: -4px;">└─► [由 <b style="color:${branch.color};">${def.prereqName}</b> 派生]</div>`;
                    }

                    let btnText = !prereqMet 
                        ? '🔒 前置未达成' 
                        : (item.level === 0 ? '⚡ 解锁研习 (1点)' : (isMax ? '✓ 已极顶' : '⚡ 研习升级 (1点)'));

                    html += `
                        ${connArrow}
                        <div style="${bgStyle} ${borderStyle} border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                    <span style="font-size: 1.05rem; font-weight: bold; color: ${prereqMet ? branch.color : '#94a3b8'};">${def.name}</span>
                                    ${badgeHtml}
                                </div>
                                <div style="font-size: 0.8rem; color: #cbd5e1; margin-top: 4px; line-height: 1.35;">${def.desc}</div>
                            </div>
                            <button onclick="upgradeDefense('${key}')" ${canAfford ? '' : 'disabled'} 
                                style="background: ${canAfford ? 'linear-gradient(135deg, #f97316, #ea580c)' : '#334155'}; color: white; border: none; padding: 8px 14px; border-radius: 12px; font-weight: bold; cursor: ${canAfford ? 'pointer' : 'not-allowed'}; white-space: nowrap; font-size: 0.82rem; box-shadow: ${canAfford ? '0 4px 12px rgba(249,115,22,0.4)' : 'none'};">
                                ${btnText}
                            </button>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            // 紧急修复城墙
            const canRepair = tdState.buildPoints > 0 && tdState.castle.hp < tdState.castle.maxHp;
            html += `
                <div style="background: #1e293b; border: 1.5px solid #10b981; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px;">
                    <div style="flex: 1;">
                        <div style="font-size: 1.05rem; font-weight: bold; color: #10b981;">🛠️ 紧急修补城墙</div>
                        <div style="font-size: 0.8rem; color: #cbd5e1; margin-top: 2px;">调度工匠修补受损城墙，恢复 2500 点耐久度 (当前城墙: ${Math.round(tdState.castle.hp)}/${tdState.castle.maxHp})</div>
                    </div>
                    <button onclick="upgradeDefense('wallRepair')" ${canRepair ? '' : 'disabled'} style="background: ${canRepair ? 'linear-gradient(135deg, #10b981, #059669)' : '#334155'}; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: ${canRepair ? 'pointer' : 'not-allowed'}; white-space: nowrap;">
                        🛠️ 修复城墙 (+2500HP)
                    </button>
                </div>
            `;

            listEl.innerHTML = html;
        }

        // 升级/建造/科技研习逻辑
        function upgradeDefense(key) {
            if (tdState.buildPoints <= 0) return;

            if (key === 'wallRepair') {
                if (tdState.castle.hp >= tdState.castle.maxHp) return;
                tdState.buildPoints--;
                tdState.castle.hp = Math.min(tdState.castle.maxHp, tdState.castle.hp + 2500);
                addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 20, "🛠️ 城墙修复 +2500 HP!", "#10b981");
                addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y, "#10b981", 15);
            } else {
                const def = tdState.defenses[key];
                if (!def || def.level >= def.maxLevel) return;

                // 检查前置条件
                if (def.prereq && (!tdState.defenses[def.prereq] || tdState.defenses[def.prereq].level <= 0)) {
                    addFloatingText(tdState.castle.width / 2, tdState.castle.y - 30, `⚠️ 前置科技未研习！请先解锁 [${tdState.defenses[def.prereq].name}]!`, "#f43f5e");
                    return;
                }

                tdState.buildPoints--;
                def.level++;

                // 研习与升级效果
                if (key === 'armor1') {
                    tdState.castle.maxHp += 1500;
                    tdState.castle.hp = Math.min(tdState.castle.maxHp, tdState.castle.hp + 1500);
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🛡️ [基础加固铠甲] Lv.${def.level}! 城墙HP+1500, 受伤减免+10%!`, "#38bdf8");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#38bdf8", 18);
                } else if (key === 'armor2') {
                    tdState.castle.maxHp += 2500;
                    tdState.castle.hp = Math.min(tdState.castle.maxHp, tdState.castle.hp + 2500);
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🦾 [精钢重型锁子甲] Lv.${def.level}! 城墙HP+2500, 额外减伤+10%!`, "#38bdf8");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#38bdf8", 22);
                } else if (key === 'archery') {
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🏹 [射术与箭技精通] Lv.${def.level}! 全员远程伤害 +20%!`, "#fde047");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#fde047", 18);
                } else if (key === 'crossbow') {
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🎯 [劲弩与强弩连发] Lv.${def.level}! 射速+15% & 贯穿破甲!`, "#fde047");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#fde047", 18);
                } else if (key === 'traps') {
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `⚙️ [机关工程学] Lv.${def.level}! 陷阱与攻城器伤害 +25%!`, "#f97316");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#f97316", 18);
                } else if (key === 'leftTower' || key === 'centerTower' || key === 'rightTower') {
                    def.atk = Math.round(def.atk * 1.35);
                    def.rate = Math.max(0.4, def.rate * 0.88);
                    def.maxHp = 500 + def.level * 300;
                    def.hp = def.maxHp;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🎉 [${def.name}] 建造/升级成功 (Lv.${def.level})!`, "#fde047");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#f97316", 18);
                } else if (key === 'wallArchers') {
                    def.count += 2;
                    def.atk = Math.round(def.atk * 1.25);
                    def.maxHp = def.count * 200;
                    def.hp = def.maxHp;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🏹💂 精锐长弓手队进驻城墙！(队伍规模: ${def.count}人)`, "#fde047");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#fde047", 20);
                } else if (key === 'moat') {
                    def.corpses = 0;
                    def.maxCorpses = 10 * def.level;
                    def.slowPct = Math.min(0.85, 0.45 + (def.level - 1) * 0.1);
                    def.dps = 25 + (def.level - 1) * 22;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🌊 护城河清淤/加宽! (容量:${def.maxCorpses}尸体 | 减速${Math.round(def.slowPct*100)}%)`, "#38bdf8");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#38bdf8", 20);
                } else if (key === 'chevalDeFrise') {
                    def.maxHp += 800;
                    def.hp = def.maxHp;
                    def.atk += 20;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🚧 尖刺拒马阵升级成功! (反弹伤害:${def.atk})`, "#f97316");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#ea580c", 20);
                } else if (key === 'catapult') {
                    def.atk = Math.round(def.atk * 1.4);
                    def.rate = Math.max(1.8, def.rate * 0.85);
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🪨 烈焰巨石投石机升级成功! (伤害:${def.atk})`, "#ea580c");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#ea580c", 20);
                } else if (key === 'ballista') {
                    def.atk = Math.round(def.atk * 1.45);
                    def.rate = Math.max(1.5, def.rate * 0.85);
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🎯 灭世连发床弩升级成功! (伤害:${def.atk})`, "#cbd5e1");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#cbd5e1", 20);
                } else if (key === 'boilingOil') {
                    def.charges += 2;
                    def.atk += 25;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🧪 金汁毒热油储备充沛! (次: ${def.charges})`, "#f59e0b");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#f59e0b", 20);
                } else if (key === 'rollingLog') {
                    def.charges += 1;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🪵 巨型带刺滚木充能完成!`, "#d97706");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#d97706", 20);
                } else if (key === 'pitfall') {
                    def.maxDurability = 800 * def.level;
                    def.durability = def.maxDurability;
                    def.slowPct = Math.min(0.85, 0.45 + (def.level - 1) * 0.08);
                    def.dps = 30 + (def.level - 1) * 25;
                    addFloatingText(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 30, `🕳️ [隐蔽陷坑阵] 挖设/重构! (耐久:${def.durability}伤害 | 减速${Math.round(def.slowPct*100)}%)`, "#f97316");
                    addParticles(tdState.castle.width / 2 + tdState.castle.x, tdState.castle.y - 10, "#d97706", 20);
                }
            }

            renderTechTreeModal();
            updateBattleUI();

            if (tdState.buildPoints <= 0) {
                setTimeout(() => {
                    closeBuildModal();
                }, 200);
            }
        }

        // 作动滚木陷阱
        function triggerRollingLog() {

        function setupCanvasDimensions() {
            if (!canvas) return;
            const parent = canvas.parentElement;
            const parentWidth = parent ? (parent.clientWidth || parent.getBoundingClientRect().width) : 320;
            const displayWidth = Math.max(280, parentWidth > 0 ? parentWidth : 320);
            const displayHeight = 220;

            canvas.width = displayWidth;
            canvas.height = displayHeight;

            tdState.castle.x = 10;
            tdState.castle.width = displayWidth - 20;
            tdState.castle.y = displayHeight - 48; // 城墙主体 y = 172
            tdState.castle.height = 42;

            // 建造设施坐落在城墙内部高台上
            tdState.defenses.leftTower.x = tdState.castle.x + 28;
            tdState.defenses.leftTower.y = tdState.castle.y + 16;

            tdState.defenses.centerTower.x = tdState.castle.x + tdState.castle.width / 2;
            tdState.defenses.centerTower.y = tdState.castle.y + 16;

            tdState.defenses.rightTower.x = tdState.castle.x + tdState.castle.width - 28;
            tdState.defenses.rightTower.y = tdState.castle.y + 16;

            // 更新已招募的三国英雄坐标 (近战出城，远程在城内)
            for (let i = 0; i < tdState.playerHeroes.length; i++) {
                const hero = tdState.playerHeroes[i];
                hero.x = tdState.castle.x + 35 + (i * 40) % (tdState.castle.width - 70);
                if (hero.type === 'melee') {
                    hero.y = tdState.castle.y - 45;
                } else {
                    hero.y = tdState.castle.y + 14;
                }
            }
        }

        function initBattleGame() {
            canvas = document.getElementById('battleCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            resetTowerDefense();

            if (battleAnimId) cancelAnimationFrame(battleAnimId);
            lastTimestamp = performance.now();
            battleAnimId = requestAnimationFrame(battleLoop);
        }

        function resetTowerDefense() {
            if (!canvas) return;
            setupCanvasDimensions();

            tdState.castle.hp = tdState.castle.maxHp = 10000;
            tdState.pausedByModal = false;
            tdState.wordsProgress = 0;
            tdState.heroWordsProgress = 0;
            tdState.pendingHeroChoices = 0;
            tdState.buildPoints = 1; // 开局免费赠送 1 点科技点！
            tdState.gameTime = 0;
            tdState.waveCount = 1;
            tdState.totalKills = 0;
            tdState.enemySpawnTimer = 0;
            tdState.enemyHeroTimer = 0;
            tdState.enemySpawnInterval = 3.5;

            // 重置所有防御设施
            for (let k in tdState.defenses) {
                const d = tdState.defenses[k];
                d.timer = 0;
                if (d.maxHp) d.hp = 0;
                if (k === 'moat') {
                    d.level = 1;
                    d.corpses = 0;
                    d.maxCorpses = 10;
                    d.slowPct = 0.45;
                    d.dps = 25;
                } else if (k === 'pitfall') {
                    d.level = 0;
                    d.durability = 0;
                    d.maxDurability = 0;
                } else {
                    d.level = 0;
                }
                if (k === 'chevalDeFrise') { d.hp = d.maxHp = 1000; }
                if (k === 'rollingLog') { d.charges = 0; }
                if (k === 'boilingOil') { d.charges = 0; }
            }

            tdState.playerHeroes = [];
            tdState.enemies = [];
            tdState.projectiles = [];
            tdState.activeLogs = [];
            tdState.oilSplashes = [];
            tdState.particles = [];
            tdState.floatingTexts = [];
            tdState.winner = null;
            tdState.running = true;

            addFloatingText(tdState.castle.width / 2, tdState.castle.y - 30, "🎉 开局赠送 1 点科技点！可立即升级或建造箭塔！", "#fde047");

            updateBattleUI();
        }

        // 刷新敌方普通士兵/Boss/攻城投石车
        function spawnEnemy() {
            const wave = Math.floor(tdState.gameTime / 20) + 1;
            tdState.waveCount = wave;

            const enemyTypes = [
                { type: 'goblin', icon: '👺', name: '哥布林先锋', hp: 90, speed: 0.55, atk: 16, radius: 8, armor: 1.0, isFly: false, isRanged: false },
                { type: 'orc', icon: '👹', name: '兽人步兵', hp: 190, speed: 0.40, atk: 28, radius: 10, armor: 1.0, isFly: false, isRanged: false },
                { type: 'archer', icon: '🏹', name: '敌军弓箭手', hp: 110, speed: 0.38, atk: 22, radius: 8, armor: 0.95, isFly: false, isRanged: true, range: 140, rate: 1.4 },
                { type: 'shield', icon: '🛡️', name: '重铠大盾兵', hp: 380, speed: 0.30, atk: 24, radius: 11, armor: 0.5, isFly: false, isRanged: false },
                { type: 'wolf', icon: '🐺', name: '座狼骑兵', hp: 160, speed: 0.65, atk: 35, radius: 10, armor: 0.9, isFly: false, isRanged: false },
                { type: 'ram', icon: '🪵', name: '攻城撞木车', hp: 650, speed: 0.25, atk: 110, radius: 13, armor: 0.8, isFly: false, isRanged: false },
                { type: 'gargoyle', icon: '🦇', name: '飞天石像鬼', hp: 170, speed: 0.48, atk: 32, radius: 9, armor: 1.0, isFly: true, isRanged: false }
            ];

            // 30 轮后出现敌军攻城投石车 (专门轰炸我方箭塔)
            if (wave > 30) {
                enemyTypes.push(
                    { type: 'catapult', icon: '☄️', name: '敌军攻城投石车', hp: 520, speed: 0.20, atk: 140, radius: 14, armor: 0.7, isFly: false, isRanged: true, range: 220, rate: 2.2, isCatapult: true }
                );
            }

            let choice = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            
            // 30 轮后有更高概率刷投石车
            if (wave > 30 && Math.random() < 0.35) {
                choice = { type: 'catapult', icon: '☄️', name: '敌军攻城投石车', hp: 520 + wave * 40, speed: 0.20, atk: 140 + wave * 10, radius: 14, armor: 0.7, isFly: false, isRanged: true, range: 220, rate: 2.2, isCatapult: true };
            }

            if (wave > 1 && wave % 5 === 0 && Math.random() < 0.25) {
                choice = { type: 'ogre', icon: '👹👑', name: '独眼巨魔酋长', hp: 1600 + wave * 100, speed: 0.20, atk: 140, radius: 14, armor: 0.7, isFly: false, isBoss: true, isRanged: false };
            }

            const spawnX = 20 + Math.random() * (tdState.castle.width - 40);

                speed: choice.speed,
                atk: Math.round(choice.atk * (1 + wave * 0.08)),
                radius: choice.radius,
                armor: choice.armor,
                isFly: choice.isFly,
                isRanged: choice.isRanged || false,
                range: choice.range || 30,
                rate: choice.rate || 1.5,
                isBoss: choice.isBoss || false,
                isCatapult: choice.isCatapult || false,
                attackCooldown: 0,
                slowFactor: 1.0,

        // 添加粒子特效
        function addParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                tdState.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 45,
