<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Flashcards & Auto-Battle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 布局容器 */
        .layout-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 95%;
            max-width: 1440px;
            gap: 50px;
            padding: 40px 0;
        }

        .container {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        /* 增大卡片尺寸 */
        .card {
            background: #1e293b;
            min-height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0px !important; /* 彻底直角图片框 */
            border: 8px solid #f97316; 
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            padding: 30px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.97);
        }
        /* 增大单词文字 - 初始状态 */
        .filename {
            font-size: 11rem;
            font-weight: 900;
            letter-spacing: -4px;
            white-space: nowrap; /* 强制单行显示 */
            pointer-events: none;
            line-height: 1;
            text-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transition: font-size 0.1s ease-out;
        }
        /* 直角图片：确保四角字母不被遮挡 */
        #displayImage {
            max-width: 100%;
            max-height: 650px;
            border-radius: 0px !important; /* 彻底直角 */
            display: none;
            object-fit: contain;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* 浮动“下一个”快捷按钮 (无论滚动到哪里都在屏幕右下角) */
        .floating-next-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: 3px solid #ffedd5;
            padding: 18px 36px;
            border-radius: 50px;
            font-size: 1.6rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-next-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 18px 36px rgba(249, 115, 22, 0.8);
            background: linear-gradient(135deg, #fb923c, #f97316);
        }
        .floating-next-btn:active {
            transform: scale(0.95);
        }

        /* 右侧控制栏：包含按钮和小地图战场 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
            position: sticky;
            top: 40px;
            flex-shrink: 0;
        }

        /* 小地图自动战斗面板 */
        .mini-map-box {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            padding: 18px;
            border-radius: 28px;
            border: 3px solid rgba(249, 115, 22, 0.6);
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .mini-map-box:hover {
            border-color: #f97316;
            box-shadow: 0 20px 45px rgba(249, 115, 22, 0.3);
        }
        .mini-map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.15rem;
            font-weight: 900;
            color: #f97316;
            letter-spacing: 0.5px;
        }
        .mini-map-header span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .battle-canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
            background: #020617;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #battleCanvas {
            width: 100%;
            height: 185px;
            display: block;
        }
        .base-hp-bars {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .hp-bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }
        .hp-bar-container.enemy {
            text-align: right;
        }
        .hp-bar-container.tower {
            text-align: center;
        }
        .hp-bar-bg {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .hp-bar-fill-ally {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.3s ease;
        }
        .hp-bar-fill-tower {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            transition: width 0.3s ease;
        }
        .hp-bar-fill-enemy {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            transition: width 0.3s ease;
        }
        .spawn-progress-container {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px 12px;
            text-align: left;
        }
        .spawn-progress-title {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .spawn-progress-bar-bg {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }
        .spawn-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f97316, #fb923c);
            transition: width 0.2s ease;
        }
        .battle-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(30, 41, 59, 0.5);
            padding: 6px 10px;
            border-radius: 10px;
            font-weight: 600;
        }
        .battle-btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-mini {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-mini-restart {
            background: #334155;
        }
        .btn-mini-restart:hover {
            background: #475569;
        }
        .btn-mini-test {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }
        .btn-mini-test:hover {
            filter: brightness(1.1);
        }

        .btn {
            padding: 22px 25px; 
            background: #f97316;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            font-size: 1.4rem; 
            box-shadow: 0 12px 24px -5px rgba(249, 115, 22, 0.4);
            transition: all 0.2s;
            text-align: center;
        }
        .btn-secondary {
            background: #334155;
            box-shadow: 0 12px 24px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-random {
            background: #8b5cf6;
            box-shadow: 0 12px 24px -5px rgba(139, 92, 246, 0.4);
            display: block;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-next-main {
            font-size: 2.3rem;
            padding: 24px 80px;
            width: 90%;
            max-width: 580px;
            border-radius: 50px;
            margin-top: 25px;
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease-in-out;
            border: 2px solid #ff7a1c;
        }
        .btn-next-main:hover {
            box-shadow: 0 15px 30px -5px rgba(249, 115, 22, 0.7);
            transform: scale(1.02);
        }
        
        .progress-hint {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #ff7a1c;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        
        .tip {
            margin-top: 25px;
            opacity: 0.6;
            font-size: 16px;
            letter-spacing: 3px;
            text-align: center;
            color: #94a3b8;
        }
        .key-hint {
            display: block;
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.7;
            font-weight: normal;
        }

        #error {
            color: #fb7185;
            display: none;
            flex-direction: column;
            gap: 20px;
            font-size: 1.5rem;
        }

        /* 响应式调整 - 中等屏幕 */
        @media (max-width: 1100px) {
            .layout-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 30px;
                padding: 20px 0;
            }
            .controls {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                position: static;
                gap: 15px;
            }
            .mini-map-box {
                width: 100%;
                max-width: 500px;
                order: -1;
                margin-bottom: 10px;
            }
            .btn {
                flex: 1;
                min-width: 150px;
            }
        }

        /* 响应式调整 - 手机端优化 */
        @media (max-width: 600px) {
            .layout-wrapper {
                padding: 10px 0;
                width: 100%;
            }
            .container {
                padding: 0 10px;
            }
            .filename { 
                font-size: 5rem; 
            }
            .card { 
                min-height: 420px; 
                padding: 15px; 
                margin-top: 5px;
                border-radius: 0px !important;
                border-width: 6px;
            }
            .btn { 
                font-size: 1rem; 
                padding: 14px 8px;
                min-width: 0;
                flex: 1 1 30%;
                border-radius: 18px;
            }
            .btn-next-main {
                font-size: 1.8rem;
                padding: 22px 30px;
                min-width: 95%;
                width: 95%;
                border-radius: 40px;
                margin-top: 20px;
            }
            .progress-hint {
                font-size: 1.15rem;
                margin-top: 15px;
            }
            .controls {
                padding: 0 10px;
                gap: 8px;
            }
            .mini-map-box { 
                order: -1; 
                padding: 12px;
                border-radius: 20px;
            }
            #displayImage {
                max-height: 380px;
            }
            .tip {
                font-size: 11px;
                margin-top: 15px;
                letter-spacing: 1px;
            }
            .key-hint {
                display: none;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

<body>
    <!-- 屏幕右下角悬浮下一个快捷按钮 -->
    <button class="floating-next-btn" onclick="nextWord()" title="快捷下一个">
        下一个 ➔
    </button>

    <div class="layout-wrapper">
        <div class="container">
            <div class="card" id="mainCard" onclick="handleCardClick()">
                <div id="textLabel" class="filename">READY</div>
                <img id="displayImage" src="" alt="Card Image">
                <div id="error">
                    <span>图片读取失败</span>
                </div>
            </div>
            
            <div style="display: flex; justify-content: center; width: 100%;">
                <button id="nextBtn" class="btn btn-next-main" onclick="nextWord()">
                    下一个 ➔
                    <span class="key-hint">Enter</span>
                </button>
            </div>

            <!-- 进度显示 -->
            <div class="progress-hint">
                第 <span id="currentWordNum">0</span> / <span id="totalWordNum">0</span> 个单词 (<span id="progressPercentage">0</span>%)
            </div>

            <p class="tip">快捷键：[空格] 翻转卡片 | [回车] 下一个/随机单词</p>
        </div>

        <div class="controls">
            <!-- 小地图自动战斗面板 (移动到最顶部) -->
            <div class="mini-map-box">
                <div class="mini-map-header">
                    <span>⚔️ 词霸战场 (小地图)</span>
                    <span id="enemyTimerBadge" style="font-size: 0.75rem; color: #fb7185; background: #331f28; padding: 2px 8px; border-radius: 10px;">⏱️ 7.0s</span>
                </div>

                <!-- 兵营与箭塔血条 -->
                <div class="base-hp-bars">
                    <div class="hp-bar-container">
                        <span style="color: #10b981;">🛡️ 我方兵营 <span id="allyHpText">500/500</span></span>
                        <div class="hp-bar-bg">
                            <div id="allyHpBar" class="hp-bar-fill-ally"></div>
                        </div>
                    </div>
                    <div class="hp-bar-container tower">
                        <span style="color: #fbbf24;">🗼 敌箭塔 <span id="enemyTowerHpText">350/350</span></span>
                        <div class="hp-bar-bg">
                            <div id="enemyTowerHpBar" class="hp-bar-fill-tower"></div>
                        </div>
                    </div>
                    <div class="hp-bar-container enemy">
                        <span style="color: #f43f5e;">🏰 敌兵营 <span id="enemyHpText">500/500</span></span>
                        <div class="hp-bar-bg">
                            <div id="enemyHpBar" class="hp-bar-fill-enemy"></div>
                        </div>
                    </div>
                </div>

                <!-- 战斗 Canvas 画布 -->
                <div class="battle-canvas-wrapper">
                    <canvas id="battleCanvas"></canvas>
                </div>

                <!-- 复习出兵进度条 -->
                <div class="spawn-progress-container">
                    <div class="spawn-progress-title">
                        <span>⚔️ 招募勇士 (每复习3词)</span>
                        <span id="spawnProgressText" style="color: #f97316;">0/3 词</span>
                    </div>
                    <div class="spawn-progress-bar-bg">
                        <div id="spawnProgressBar" class="spawn-progress-bar-fill"></div>
                    </div>
                </div>

                <!-- 战况统计 -->
                <div class="battle-stats">
                    <span>🛡️ 我方: <b id="allyCountText" style="color:#10b981;">0</b></span>
                    <span>👹 敌方: <b id="enemyCountText" style="color:#f43f5e;">0</b></span>
                    <span>⚔️ 击杀: <b id="killCountText" style="color:#fbbf24;">0</b></span>
                </div>

                <!-- 游戏控制按钮 -->
                <div class="battle-btn-row">
                    <button class="btn-mini btn-mini-restart" onclick="resetBattleGame()">🔄 重置战场</button>
                    <button class="btn-mini btn-mini-test" onclick="testSpawnAllyUnit()" title="模拟复习3个单词">⚔️ 召兵(+3词)</button>
                </div>
            </div>

            <!-- 侧栏按钮列表 -->
            <button class="btn" style="background: linear-gradient(135deg, #f97316, #ea580c); font-size: 1.8rem; padding: 22px 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(249, 115, 22, 0.5);" onclick="nextWord()">
                下一个 ➔
            </button>

            <button class="btn btn-secondary" onclick="prevWord()">前一张</button>
            
            <button class="btn btn-secondary" onclick="next20Words()">下20个</button>
            
            <button id="randomBtn" class="btn btn-random" onclick="randomWord()">
                随机单词
                <span class="key-hint">Enter</span>
            </button>
        </div>
    </div>

    <script>
        const fallbackImages = [
            "alentar.jpg", "arana.jpg", "barba.jpg", "cantidad.jpg", "cartel.jpg",
            "cartelera.jpg", "comodo.jpg", "creido.jpg", "crisis.jpg", "criticar.jpg",
            "debilitar.jpg", "encima.jpg", "enfadar.jpg", "estimar.jpg", "fantasma.jpg",
            "fastidiar.jpg", "garantizar.jpg", "groso.jpg", "grosor.jpg", "horno.jpg",
            "incendio.jpg", "llorar.jpg", "melon.jpg", "moreno.jpg", "morir.jpg",
            "mostrar.jpg", "pandillero.jpg", "pared.jpg", "peligroso.jpg", "pluma.jpg",
            "potenciar.jpg", "punta.jpg", "rutina.jpg", "terremoto.jpg", "tortilla.jpg",
            "vigilar.jpg", "viuda.jpg"
        ];

        let images = [...fallbackImages];
        let imageFolderPath = "Edibujar/";

        async function loadDynamicImages() {
            let owner = "u3823433669-ui";
            let repo = "palabarjuego"; // 优先匹配当前新建立的仓库

            const hostname = window.location.hostname;
            const pathname = window.location.pathname;

            // 智能分析当前访问的 github pages 仓库所有者和仓库名
            if (hostname.endsWith('.github.io')) {
                owner = hostname.replace('.github.io', '');
                const pathParts = pathname.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    repo = pathParts[0];
                }
            }

            // 尝试读取 Edibujar（大写首字母）或 edibujar（全小写）
            const folderCandidates = ["Edibujar", "edibujar"];
            for (const folder of folderCandidates) {
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;
                console.log(`正在尝试从 GitHub API 加载 [${folder}] 文件夹:`, apiUrl);

                try {
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        if (Array.isArray(data)) {
                            const validExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
                            const fetchedImages = data
                                .filter(file => file.type === 'file' && validExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
                                .map(file => file.name);
                            
                            if (fetchedImages.length > 0) {
                                images = fetchedImages;
                                imageFolderPath = folder + "/";
                                console.log(`🎉 成功从 GitHub [${folder}] 动态加载到 ${images.length} 个图片:`, images);
                                break;
                            }
                        }
                    }
                } catch (error) {
                    console.warn(`从 ${folder} 加载失败:`, error);
                }
            }
        }

        let currentIndex = -1;
        let isRevealed = false;
        let lastActionWasRandom = false; 

        // 滑动相关状态变量
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let isSwiped = false;

        // 核心优化：超大显眼字号与智能防超框微调
        function fitText(el) {
            if (!el || !el.parentElement) return;
            const container = el.parentElement;
            const style = window.getComputedStyle(container);
            const paddingLeft = parseFloat(style.paddingLeft) || 15;
            const paddingRight = parseFloat(style.paddingRight) || 15;
            const maxWidth = Math.max(100, container.clientWidth - paddingLeft - paddingRight);
            
            // 显著增大字号（桌面端 120px / 移动端 64px）
            let fontSize = window.innerWidth <= 600 ? 64 : 120; 
            el.style.fontSize = fontSize + 'px';
            
            // 仅对极个别超长单词微调缩小，保证清晰巨型大字
            while (el.offsetWidth > maxWidth && fontSize > 28) {
                fontSize -= 2;
                el.style.fontSize = fontSize + 'px';
            }
        }

        function updateDisplay() {
            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const errorElement = document.getElementById('error');
            const card = document.getElementById('mainCard');
            
            if (currentIndex === -1) return;
            
            const fileName = images[currentIndex];
            const displayName = fileName.split('.')[0];
            const fullPath = imageFolderPath + fileName + "?v=" + new Date().getTime();

            isRevealed = false;
            imgElement.style.display = 'none';
            textLabel.innerText = displayName;
            textLabel.style.display = 'block';
            errorElement.style.display = 'none';
            card.style.backgroundColor = '#1e293b';

            // 更新进度 UI
            const totalCount = images.length;
            const currentNum = currentIndex + 1;
            const progressPct = totalCount > 0 ? Math.round((currentNum / totalCount) * 100) : 0;
            
            document.getElementById('currentWordNum').innerText = currentNum;
            document.getElementById('totalWordNum').innerText = totalCount;
            document.getElementById('progressPercentage').innerText = progressPct;

            // 设置文字后立即调用缩放函数
            fitText(textLabel);

            // 预加载图片（增加多途径备用容错，如大小写切换）
            imgElement.src = fullPath;
            imgElement.onload = function() {
                console.log('Preloaded success: ' + fullPath);
            };
            imgElement.onerror = function() {
                console.warn('Preload failed for: ' + fullPath + ', trying alternate casing...');
                // 自动尝试大小写容错路径
                const altFolder = imageFolderPath.startsWith("Edibujar") ? "edibujar/" : "Edibujar/";
                const altPath = altFolder + fileName;
                
                // 如果备用路径成功，更新当前使用的路径
                const tempImg = new Image();
                tempImg.src = altPath;
                tempImg.onload = function() {
                    imageFolderPath = altFolder;
                    imgElement.src = altPath;
                };
            };
        }

        function next20Words() {
            lastActionWasRandom = false;
            if (images.length === 0) return;
            if (currentIndex === -1) {
                currentIndex = 19 % images.length;
            } else {
                currentIndex = (currentIndex + 20) % images.length;
            }
            updateDisplay();
            recordWordReview(20);
        }

        function nextWord() {
            lastActionWasRandom = false;
            currentIndex = (currentIndex + 1) % images.length;
            updateDisplay();
            recordWordReview(1);
        }

        function prevWord() {
            lastActionWasRandom = false;
            if (currentIndex <= 0) {
                currentIndex = images.length - 1;
            } else {
                currentIndex--;
            }
            updateDisplay();
            recordWordReview(1);
        }

        function randomWord() {
            lastActionWasRandom = true;
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * images.length);
            } while (newIndex === currentIndex && images.length > 1);
            
            currentIndex = newIndex;
            updateDisplay();
            recordWordReview(1);
        }

        function handleCardClick() {
            if (isSwiped) {
                isSwiped = false;
                return;
            }
            if (isRevealed) {
                updateDisplay();
            } else {
                revealImage();
            }
        }

        // 绑定触屏手势进行左右滑动切换
        const mainCard = document.getElementById('mainCard');
        mainCard.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
            isSwiped = false;
        }, { passive: true });

        mainCard.addEventListener('touchmove', function(event) {
            const currentX = event.changedTouches[0].screenX;
            const currentY = event.changedTouches[0].screenY;
            const diffX = touchStartX - currentX;
            const diffY = Math.abs(touchStartY - currentY);
            
            // 如果位移过大，说明是滑动，避免松手时触发 handleCardClick 的翻转
            if (Math.abs(diffX) > 15 || diffY > 15) {
                isSwiped = true;
            }
        }, { passive: true });

        mainCard.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            // 左滑 -> 下一个 (阈值为 50 像素，且水平偏移大于垂直偏移)
            if (diffX > 50 && diffY < diffX) {
                nextWord();
            } 
            // 右滑 -> 前一张
            else if (diffX < -50 && diffY < Math.abs(diffX)) {
                prevWord();
            }
        }, { passive: true });

        function revealImage() {
            if (currentIndex === -1) return;

            const textLabel = document.getElementById('textLabel');
            const imgElement = document.getElementById('displayImage');
            const card = document.getElementById('mainCard');
            const errorElement = document.getElementById('error');

            if (imgElement.complete && imgElement.naturalHeight === 0) {
                errorElement.style.display = 'flex';
                textLabel.style.display = 'none';
            } else {
                textLabel.style.display = 'none';
                imgElement.style.display = 'block';
                card.style.backgroundColor = '#0f172a';
            }
            isRevealed = true;
        }

        // 键盘监听
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                handleCardClick();
            } else if (e.code === 'Enter') {
                if (lastActionWasRandom) {
                    randomWord();
                } else {
                    nextWord();
                }
            }
        });

        // 监听窗口大小变化以重新调整字体与画布
        window.addEventListener('resize', () => {
            const textLabel = document.getElementById('textLabel');
            if (textLabel.style.display !== 'none') {
                fitText(textLabel);
            }
            if (canvas) {
                setupCanvasDimensions();
            }
        });

        // ==========================================
        // ⚔️ 小地图自动战斗系统 (Auto-Battle Engine)
        // ==========================================
        
        let canvas, ctx;
        let battleAnimId = null;
        let lastTimestamp = 0;

        const battleState = {
            running: true,
            
            allyBase: {
                x: 35,
                y: 92,
                radius: 20,
                hp: 500,
                maxHp: 500
            },
            enemyTower: {
                x: 215,
                y: 92,
                radius: 16,
                hp: 350,
                maxHp: 350,
                range: 85,
                attack: 16,
                attackCooldown: 0,
                attackInterval: 1.0
            },
            enemyBase: {
                x: 280,
                y: 92,
                radius: 20,
                hp: 500,
                maxHp: 500
            },

            wordsReviewedCount: 0,
            wordsProgress: 0, // 0~3
            totalAllySpawned: 0,
            totalEnemySpawned: 0,
            totalKills: 0,

            enemySpawnTimer: 0,
            enemySpawnInterval: 7.0, // 每 7.0 秒敌方出一个兵

            allyUnits: [],
            enemyUnits: [],
            particles: [],
            floatingTexts: [],

            winner: null // null | 'ally' | 'enemy'
        };

        function setupCanvasDimensions() {
            if (!canvas) return;
            const parent = canvas.parentElement;
            const parentWidth = parent ? (parent.clientWidth || parent.getBoundingClientRect().width) : 320;
            const displayWidth = Math.max(260, parentWidth > 0 ? parentWidth : 320);
            const displayHeight = 185;

            canvas.width = displayWidth;
            canvas.height = displayHeight;

            battleState.allyBase.x = 32;
            battleState.allyBase.y = displayHeight / 2;
            
            // 敌方箭塔位于敌方大本营前方
            battleState.enemyTower.x = Math.max(160, Math.round(displayWidth - 88));
            battleState.enemyTower.y = displayHeight / 2;

            battleState.enemyBase.x = Math.max(210, Math.round(displayWidth - 32));
            battleState.enemyBase.y = displayHeight / 2;
        }

        function initBattleGame() {
            canvas = document.getElementById('battleCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            resetBattleGame();

            if (battleAnimId) cancelAnimationFrame(battleAnimId);
            lastTimestamp = performance.now();
            battleAnimId = requestAnimationFrame(battleLoop);
        }

        function resetBattleGame() {
            if (!canvas) return;
            setupCanvasDimensions();

            battleState.allyBase.hp = battleState.allyBase.maxHp = 500;
            battleState.enemyTower.hp = battleState.enemyTower.maxHp = 350;
            battleState.enemyTower.attackCooldown = 0;
            battleState.enemyBase.hp = battleState.enemyBase.maxHp = 500;

            battleState.wordsProgress = 0;
            battleState.totalAllySpawned = 0;
            battleState.totalEnemySpawned = 0;
            battleState.totalKills = 0;
            battleState.enemySpawnTimer = 0;
            battleState.allyUnits = [];
            battleState.enemyUnits = [];
            battleState.particles = [];
            battleState.floatingTexts = [];
            battleState.winner = null;
            battleState.running = true;

            // 初始时敌我双方各产生1个士兵增加开场对战感
            spawnAllyUnit('knight');
            spawnEnemyUnit('warrior');

            updateBattleUI();
        }

        // 单词复习触发器：每复习3个单词出一个兵
        function recordWordReview(count = 1) {
            if (battleState.winner) return; // 战斗已完结则不再触发招募

            battleState.wordsReviewedCount += count;
            battleState.wordsProgress += count;

            // 检查是否达到 3 个单词的出兵阈值
            while (battleState.wordsProgress >= 3) {
                battleState.wordsProgress -= 3;
                
                battleState.totalAllySpawned++;
                const spawnedType = spawnAllyUnit();

                let typeName = "⚔️ 战士出击!";
                if (spawnedType === 'archer') typeName = "🏹 弓箭手出击!";
                else if (spawnedType === 'mage') typeName = "🧙‍♂️ 法师降临!";
                else if (spawnedType === 'shield') typeName = "🛡️ 盾兵重出!";

                // 飘字提示
                addFloatingText(
                    battleState.allyBase.x, 
                    battleState.allyBase.y - 25, 
                    typeName, 
                    "#10b981"
                );
            }

            updateBattleUI();
        }

        function testSpawnAllyUnit() {
            recordWordReview(3);
        }

        // 召唤我方士兵 (随机：战士40%、弓箭手40%、小概率法师10%、小概率盾兵10%)
        function spawnAllyUnit(forcedType = null) {
            let type = forcedType;
            if (!type) {
                const rand = Math.random();
                if (rand < 0.40) {
                    type = 'knight'; // 战士 (40%)
                } else if (rand < 0.80) {
                    type = 'archer'; // 弓箭手 (40%)
                } else if (rand < 0.90) {
                    type = 'mage'; // 法师 (10%)
                } else {
                    type = 'shield'; // 盾兵 (10%)
                }
            }

            let icon = '⚔️';
            let hp = 110, maxHp = 110;
            let attack = 18;
            let speed = 1.25;
            let range = 18;
            let attackInterval = 0.7;
            let radius = 10;

            if (type === 'archer') {
                icon = '🏹';
                hp = maxHp = 85;
                attack = 22;
                speed = 1.0;
                range = 60;
                attackInterval = 0.9;
                radius = 9;
            } else if (type === 'mage') {
                icon = '🧙‍♂️';
                hp = maxHp = 75;
                attack = 35;
                speed = 0.9;
                range = 70;
                attackInterval = 1.1;
                radius = 9;
            } else if (type === 'shield') {
                icon = '🛡️';
                hp = maxHp = 240;
                attack = 10;
                speed = 0.8;
                range = 15;
                attackInterval = 1.0;
                radius = 12;
            } else { // knight
                icon = '⚔️';
                hp = maxHp = 110;
                attack = 18;
                speed = 1.25;
                range = 18;
                attackInterval = 0.7;
                radius = 10;
            }

            const unit = {
                id: Math.random().toString(36).substr(2, 9),
                team: 'ally',
                type: type,
                icon: icon,
                x: battleState.allyBase.x + 15,
                y: battleState.allyBase.y + (Math.random() * 20 - 10),
                hp: hp,
                maxHp: maxHp,
                attack: attack,
                speed: speed,
                range: range,
                attackCooldown: 0,
                attackInterval: attackInterval,
                radius: radius
            };
            battleState.allyUnits.push(unit);

            const particleColor = type === 'mage' ? "#c084fc" : (type === 'shield' ? "#60a5fa" : "#10b981");
            addParticles(unit.x, unit.y, particleColor, 6);
            updateBattleUI();

            return type;
        }

        // 召唤敌方士兵 (随机出 敌战士 50% / 敌弓箭手 50%)
        function spawnEnemyUnit(forcedType = null) {
            battleState.totalEnemySpawned++;
            let type = forcedType;
            if (!type) {
                type = Math.random() < 0.5 ? 'warrior' : 'archer';
            }

            const isArcher = type === 'archer';
            const icon = isArcher ? '🏹' : '🐺';
            const hp = isArcher ? 70 : 95;
            const maxHp = hp;
            const attack = isArcher ? 20 : 15;
            const speed = isArcher ? 1.0 : 1.1;
            const range = isArcher ? 55 : 18;
            const attackInterval = isArcher ? 0.9 : 0.8;
            const radius = isArcher ? 9 : 10;

            const unit = {
                id: Math.random().toString(36).substr(2, 9),
                team: 'enemy',
                type: type,
                icon: icon,
                x: battleState.enemyBase.x - 15,
                y: battleState.enemyBase.y + (Math.random() * 20 - 10),
                hp: hp,
                maxHp: maxHp,
                attack: attack,
                speed: speed,
                range: range,
                attackCooldown: 0,
                attackInterval: attackInterval,
                radius: radius
            };
            battleState.enemyUnits.push(unit);
            addParticles(unit.x, unit.y, "#f43f5e", 6);
            updateBattleUI();

            return type;
        }

        // 添加粒子特效
        function addParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                battleState.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.03,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // 添加飘字特效
        function addFloatingText(x, y, text, color) {
            battleState.floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 1.0,
                vy: -0.8
            });
        }

        // 主战斗循环
        function battleLoop(now) {
            const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
            lastTimestamp = now;

            if (battleState.running && !battleState.winner) {
                updateBattleLogic(dt);
            }

            renderBattleCanvas();

            battleAnimId = requestAnimationFrame(battleLoop);
        }

        function updateBattleLogic(dt) {
            // 敌方每 7 秒自动出兵
            battleState.enemySpawnTimer += dt;
            if (battleState.enemySpawnTimer >= battleState.enemySpawnInterval) {
                battleState.enemySpawnTimer = 0;
                spawnEnemyUnit();
            }

            // 更新敌方出兵倒计时 UI
            const remainingTimer = Math.max(0, battleState.enemySpawnInterval - battleState.enemySpawnTimer).toFixed(1);
            const timerBadge = document.getElementById('enemyTimerBadge');
            if (timerBadge) {
                timerBadge.innerText = `⏱️ 敌出兵: ${remainingTimer}s`;
            }

            // 1. 敌方弓箭塔攻击逻辑 (自动向射程内最近的我方单位射击)
            if (battleState.enemyTower.hp > 0) {
                battleState.enemyTower.attackCooldown = Math.max(0, battleState.enemyTower.attackCooldown - dt);

                let closestAlly = null;
                let minTowerDist = Infinity;
                for (let ally of battleState.allyUnits) {
                    const dist = Math.hypot(ally.x - battleState.enemyTower.x, ally.y - battleState.enemyTower.y);
                    if (dist < minTowerDist) {
                        minTowerDist = dist;
                        closestAlly = ally;
                    }
                }

                if (closestAlly && minTowerDist <= battleState.enemyTower.range) {
                    if (battleState.enemyTower.attackCooldown <= 0) {
                        battleState.enemyTower.attackCooldown = battleState.enemyTower.attackInterval;
                        const dmg = battleState.enemyTower.attack;
                        closestAlly.hp -= dmg;

                        addFloatingText(closestAlly.x, closestAlly.y - 10, `-${dmg}`, "#fbbf24");
                        addParticles(closestAlly.x, closestAlly.y, "#f59e0b", 4);
                        addParticles(battleState.enemyTower.x, battleState.enemyTower.y - 8, "#fbbf24", 2);
                    }
                }
            }

            // 2. 更新我方单位
            for (let unit of battleState.allyUnits) {
                unit.attackCooldown = Math.max(0, unit.attackCooldown - dt);

                let target = null;
                let minDist = Infinity;

                for (let enemy of battleState.enemyUnits) {
                    const dist = Math.hypot(enemy.x - unit.x, enemy.y - unit.y);
                    if (dist < minDist) {
                        minDist = dist;
                        target = enemy;
                    }
                }

                // 优先攻击敌方单位
                if (target && minDist <= unit.range + target.radius) {
                    if (unit.attackCooldown <= 0) {
                        unit.attackCooldown = unit.attackInterval;
                        const isCrit = Math.random() < 0.2;
                        const dmg = isCrit ? Math.round(unit.attack * 1.5) : unit.attack;
                        target.hp -= dmg;

                        const particleColor = unit.type === 'mage' ? "#c084fc" : "#f97316";
                        addFloatingText(target.x, target.y - 10, isCrit ? `-${dmg}!` : `-${dmg}`, isCrit ? "#fbbf24" : "#ffffff");
                        addParticles(target.x, target.y, particleColor, 5);
                    }
                }
                // 若箭塔未毁且进入射程，则攻击敌方弓箭塔
                else if (battleState.enemyTower.hp > 0 && Math.hypot(battleState.enemyTower.x - unit.x, battleState.enemyTower.y - unit.y) <= unit.range + battleState.enemyTower.radius) {
                    if (unit.attackCooldown <= 0) {
                        unit.attackCooldown = unit.attackInterval;
                        const dmg = unit.attack;
                        battleState.enemyTower.hp -= dmg;

                        const particleColor = unit.type === 'mage' ? "#c084fc" : "#f97316";
                        addFloatingText(battleState.enemyTower.x, battleState.enemyTower.y - 15, `-${dmg}`, "#fbbf24");
                        addParticles(battleState.enemyTower.x, battleState.enemyTower.y, particleColor, 5);

                        if (battleState.enemyTower.hp <= 0) {
                            battleState.enemyTower.hp = 0;
                            addFloatingText(battleState.enemyTower.x, battleState.enemyTower.y - 20, "💥 箭塔摧毁!", "#10b981");
                            addParticles(battleState.enemyTower.x, battleState.enemyTower.y, "#fb7185", 15);
                        }
                    }
                }
                // 攻击敌方大本营
                else if (Math.hypot(battleState.enemyBase.x - unit.x, battleState.enemyBase.y - unit.y) <= unit.range + battleState.enemyBase.radius) {
                    if (unit.attackCooldown <= 0) {
                        unit.attackCooldown = unit.attackInterval;
                        battleState.enemyBase.hp -= unit.attack;
                        addFloatingText(battleState.enemyBase.x, battleState.enemyBase.y - 20, `-${unit.attack}`, "#f43f5e");
                        addParticles(battleState.enemyBase.x, battleState.enemyBase.y, "#f43f5e", 6);
                        
                        if (battleState.enemyBase.hp <= 0) {
                            battleState.enemyBase.hp = 0;
                            battleState.winner = 'ally';
                            addFloatingText(battleState.enemyBase.x, battleState.enemyBase.y, "🎉 敌军兵营摧毁!", "#10b981");
                        }
                    }
                }
                // 前进
                else {
                    unit.x += unit.speed * dt * 30;
                }
            }

            // 3. 更新敌方单位
            for (let unit of battleState.enemyUnits) {
                unit.attackCooldown = Math.max(0, unit.attackCooldown - dt);

                let target = null;
                let minDist = Infinity;

                for (let ally of battleState.allyUnits) {
                    const dist = Math.hypot(ally.x - unit.x, ally.y - unit.y);
                    if (dist < minDist) {
                        minDist = dist;
                        target = ally;
                    }
                }

                // 攻击我方单位
                if (target && minDist <= unit.range + target.radius) {
                    if (unit.attackCooldown <= 0) {
                        unit.attackCooldown = unit.attackInterval;
                        const dmg = unit.attack;
                        target.hp -= dmg;

                        addFloatingText(target.x, target.y - 10, `-${dmg}`, "#f43f5e");
                        addParticles(target.x, target.y, "#f43f5e", 4);
                    }
                }
                // 攻击我方大本营
                else if (Math.hypot(battleState.allyBase.x - unit.x, battleState.allyBase.y - unit.y) <= unit.range + battleState.allyBase.radius) {
                    if (unit.attackCooldown <= 0) {
                        unit.attackCooldown = unit.attackInterval;
                        battleState.allyBase.hp -= unit.attack;
                        addFloatingText(battleState.allyBase.x, battleState.allyBase.y - 20, `-${unit.attack}`, "#10b981");
                        addParticles(battleState.allyBase.x, battleState.allyBase.y, "#10b981", 6);

                        if (battleState.allyBase.hp <= 0) {
                            battleState.allyBase.hp = 0;
                            battleState.winner = 'enemy';
                            addFloatingText(battleState.allyBase.x, battleState.allyBase.y, "💥 我方兵营沦陷!", "#f43f5e");
                        }
                    }
                }
                // 前进
                else {
                    unit.x -= unit.speed * dt * 30;
                }
            }

            // 清理阵亡单位
            const deadEnemies = battleState.enemyUnits.filter(u => u.hp <= 0);
            if (deadEnemies.length > 0) {
                battleState.totalKills += deadEnemies.length;
                deadEnemies.forEach(u => addParticles(u.x, u.y, "#fb7185", 10));
            }

            battleState.allyUnits = battleState.allyUnits.filter(u => u.hp > 0);
            battleState.enemyUnits = battleState.enemyUnits.filter(u => u.hp > 0);

            // 更新粒子
            for (let p of battleState.particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
            }
            battleState.particles = battleState.particles.filter(p => p.life > 0);

            // 更新飘字
            for (let ft of battleState.floatingTexts) {
                ft.y += ft.vy;
                ft.life -= 0.02;
            }
            battleState.floatingTexts = battleState.floatingTexts.filter(ft => ft.life > 0);

            updateBattleUI();
        }

        function updateBattleUI() {
            // 我方 HP
            const allyHpText = document.getElementById('allyHpText');
            const allyHpBar = document.getElementById('allyHpBar');
            if (allyHpText && allyHpBar) {
                const pct = Math.max(0, Math.round((battleState.allyBase.hp / battleState.allyBase.maxHp) * 100));
                allyHpText.innerText = `${Math.round(battleState.allyBase.hp)}/${battleState.allyBase.maxHp}`;
                allyHpBar.style.width = pct + '%';
            }

            // 敌方箭塔 HP
            const enemyTowerHpText = document.getElementById('enemyTowerHpText');
            const enemyTowerHpBar = document.getElementById('enemyTowerHpBar');
            if (enemyTowerHpText && enemyTowerHpBar) {
                const pct = Math.max(0, Math.round((battleState.enemyTower.hp / battleState.enemyTower.maxHp) * 100));
                enemyTowerHpText.innerText = `${Math.round(battleState.enemyTower.hp)}/${battleState.enemyTower.maxHp}`;
                enemyTowerHpBar.style.width = pct + '%';
            }

            // 敌方兵营 HP
            const enemyHpText = document.getElementById('enemyHpText');
            const enemyHpBar = document.getElementById('enemyHpBar');
            if (enemyHpText && enemyHpBar) {
                const pct = Math.max(0, Math.round((battleState.enemyBase.hp / battleState.enemyBase.maxHp) * 100));
                enemyHpText.innerText = `${Math.round(battleState.enemyBase.hp)}/${battleState.enemyBase.maxHp}`;
                enemyHpBar.style.width = pct + '%';
            }

            // 单词复习招募进度条
            const spawnProgressText = document.getElementById('spawnProgressText');
            const spawnProgressBar = document.getElementById('spawnProgressBar');
            if (spawnProgressText && spawnProgressBar) {
                spawnProgressText.innerText = `${battleState.wordsProgress}/3 词`;
                spawnProgressBar.style.width = `${(battleState.wordsProgress / 3) * 100}%`;
            }

            // 战况统计文本
            const allyCountText = document.getElementById('allyCountText');
            const enemyCountText = document.getElementById('enemyCountText');
            const killCountText = document.getElementById('killCountText');

            if (allyCountText) allyCountText.innerText = battleState.allyUnits.length;
            if (enemyCountText) enemyCountText.innerText = battleState.enemyUnits.length;
            if (killCountText) killCountText.innerText = battleState.totalKills;
        }

        // 绘制 Canvas
        function renderBattleCanvas() {
            if (!ctx || !canvas) return;

            // 自动检测与拉伸 Canvas 适应容器宽度
            if (canvas.parentElement) {
                const parentW = canvas.parentElement.clientWidth || canvas.parentElement.getBoundingClientRect().width;
                if (parentW > 0 && Math.abs(canvas.width - parentW) > 5) {
                    setupCanvasDimensions();
                }
            }

            const w = canvas.width;
            const h = canvas.height;

            // 背景底色
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, w, h);

            // 战场中间道路 (Lane)
            const laneHeight = 36;
            const laneY = h / 2 - laneHeight / 2;

            // 绘制道路纹理
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, laneY, w, laneHeight);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, laneY, w, laneHeight);

            // 道路中心虚线
            ctx.strokeStyle = '#334155';
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();
            ctx.setLineDash([]); // 还原

            // 绘制我方兵营
            const ab = battleState.allyBase;
            ctx.fillStyle = '#064e3b';
            ctx.beginPath();
            ctx.arc(ab.x, ab.y, ab.radius + 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(ab.x, ab.y, ab.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏰', ab.x, ab.y);

            // 绘制敌方防御箭塔 (若未被销毁)
            const et = battleState.enemyTower;
            if (et.hp > 0) {
                // 射程虚线圈 (淡红色)
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(et.x, et.y, et.range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 箭塔底座
                ctx.fillStyle = '#78350f';
                ctx.beginPath();
                ctx.arc(et.x, et.y, et.radius + 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(et.x, et.y, et.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🗼', et.x, et.y);

                // 箭塔 Canvas 头顶血条
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(et.x - 12, et.y - 22, 24, 3);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(et.x - 12, et.y - 22, Math.max(0, (et.hp / et.maxHp) * 24), 3);
            }

            // 绘制敌方大本营
            const eb = battleState.enemyBase;
            ctx.fillStyle = '#881337';
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, eb.radius + 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏯', eb.x, eb.y);

            // 绘制我方单位
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let unit of battleState.allyUnits) {
                // 血条背景
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(unit.x - 10, unit.y - 18, 20, 3);
                // 当前血量
                ctx.fillStyle = '#10b981';
                ctx.fillRect(unit.x - 10, unit.y - 18, Math.max(0, (unit.hp / unit.maxHp) * 20), 3);

                // 单位图标
                ctx.font = '15px sans-serif';
                ctx.fillText(unit.icon, unit.x, unit.y);
            }

            // 绘制敌方单位
            for (let unit of battleState.enemyUnits) {
                // 血条背景
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(unit.x - 10, unit.y - 18, 20, 3);
                // 当前血量
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(unit.x - 10, unit.y - 18, Math.max(0, (unit.hp / unit.maxHp) * 20), 3);

                // 单位图标
                ctx.font = '15px sans-serif';
                ctx.fillText(unit.icon, unit.x, unit.y);
            }

            // 绘制粒子
            for (let p of battleState.particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 绘制飘字
            for (let ft of battleState.floatingTexts) {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1.0;

            // 胜负横幅 Overlay
            if (battleState.winner) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (battleState.winner === 'ally') {
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.fillText('🏆 我方大本营胜利！', w / 2, h / 2 - 12);

                    ctx.fillStyle = '#f97316';
                    ctx.font = '12px sans-serif';
                    ctx.fillText('成功击溃敌方兵营！', w / 2, h / 2 + 14);
                } else {
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.fillText('💀 我方兵营沦陷！', w / 2, h / 2 - 12);

                    ctx.fillStyle = '#cbd5e1';
                    ctx.font = '12px sans-serif';
                    ctx.fillText('多复习单词强化军队，重来一次！', w / 2, h / 2 + 14);
                }
            }
        }

        window.onload = async function() {
            await loadDynamicImages();
            initBattleGame();
            nextWord();
        };
    </script>
</body>
</html>
