        // 添加伤害/提示飘字
        function addFloatingText(x, y, text, color = '#ffffff') {
            tdState.floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 1.0
            });
        }

        // 游戏主循环
        function battleLoop(timestamp) {
            const dt = Math.min(0.08, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            if (tdState.running && !tdState.winner && !tdState.pausedByModal) {
                tdState.gameTime += dt;
                updateTowerDefense(dt);
            }

            renderTowerDefense();
            battleAnimId = requestAnimationFrame(battleLoop);
        }

        // 寻找敌军攻击目标 (随机攻击城墙/英雄/士兵/箭塔；投石车专门攻击箭塔)
        function findEnemyTarget(enemy) {
            // 1. 如果是敌军投石车，专门优先攻击我方箭塔 (左/中/右)
            if (enemy.isCatapult) {
                const towers = [tdState.defenses.leftTower, tdState.defenses.centerTower, tdState.defenses.rightTower];
                const activeTowers = towers.filter(t => t.level > 0 && t.hp > 0);
                if (activeTowers.length > 0) {
                    const chosenTower = activeTowers[Math.floor(Math.random() * activeTowers.length)];
                    return { type: 'tower', obj: chosenTower, x: chosenTower.x, y: chosenTower.y };
                }
            }

            // 2. 检查已锁定目标是否仍然有效，若有效则维持锁定
            if (enemy.currentTarget && enemy.currentTarget.obj) {
                const obj = enemy.currentTarget.obj;
                if (enemy.currentTarget.type === 'hero' && obj.hp > 0) return enemy.currentTarget;
                if (enemy.currentTarget.type === 'tower' && obj.level > 0 && obj.hp > 0) return enemy.currentTarget;
                if (enemy.currentTarget.type === 'wallArchers' && obj.level > 0 && obj.hp > 0 && obj.count > 0) return enemy.currentTarget;
                if (enemy.currentTarget.type === 'castle' && tdState.castle.hp > 0) return enemy.currentTarget;
            }

            // 3. 收集所有可用的攻击目标列表 (随机攻击城墙、英雄、士兵、箭塔)
            const candidates = [];

            // 默认城墙 (总是可作为目标)
            candidates.push({ type: 'castle', obj: tdState.castle, x: enemy.x, y: tdState.castle.y - 12 });

            // 存活英雄
            const activeHeroes = tdState.playerHeroes.filter(h => h.hp > 0);
            for (let hero of activeHeroes) {
                candidates.push({ type: 'hero', obj: hero, x: hero.x, y: hero.y });
            }

            // 活跃箭塔
            const towers = [tdState.defenses.leftTower, tdState.defenses.centerTower, tdState.defenses.rightTower];
            for (let t of towers) {
                if (t.level > 0 && t.hp > 0) {
                    candidates.push({ type: 'tower', obj: t, x: t.x, y: t.y });
                }
            }

            // 城墙弓箭手小队
            const wallArchers = tdState.defenses.wallArchers;
            if (wallArchers.level > 0 && wallArchers.hp > 0 && wallArchers.count > 0) {
                candidates.push({ type: 'wallArchers', obj: wallArchers, x: enemy.x, y: tdState.castle.y + 14 });
            }

            // 从可选目标中随机选择一个！
            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            enemy.currentTarget = chosen;
            return chosen;
        }

        // 逻辑更新
        function updateTowerDefense(dt) {
            // 1. 刷敌逻辑
            tdState.enemySpawnTimer += dt;
            const currentInterval = Math.max(1.6, tdState.enemySpawnInterval - tdState.gameTime * 0.018);
            if (tdState.enemySpawnTimer >= currentInterval) {
                tdState.enemySpawnTimer = 0;
                spawnEnemy();
            }

            // 1b. 敌方三国魔将降临 (10 轮后开始随机刷新，不是每轮都刷)
            tdState.enemyHeroTimer += dt;
            if (tdState.enemyHeroTimer >= 22 && tdState.waveCount > 10) {
                tdState.enemyHeroTimer = 0;
                if (Math.random() < 0.45) {
                    spawnEnemyHero();
                }
            }

            // 2. 敌军移动与接战逻辑
            const castleY = tdState.castle.y;
            const moatActive = tdState.defenses.moat.level > 0;
            const chevalActive = tdState.defenses.chevalDeFrise.level > 0 && tdState.defenses.chevalDeFrise.hp > 0;
            const chevalY = castleY - 20;

            for (let i = tdState.enemies.length - 1; i >= 0; i--) {
                const enemy = tdState.enemies[i];
                enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
                enemy.slowFactor = 1.0;

                // ① 护城河加宽减速与淹溺伤害 (非飞行敌军)
                if (!enemy.isFly && moatActive) {
                    const moatLvl = tdState.defenses.moat.level;
                    const moatHeight = 10 + moatLvl * 6;
                    const calcMoatY = castleY - 28 - moatHeight / 2;
                    if (enemy.y >= calcMoatY - 2 && enemy.y <= calcMoatY + moatHeight + 2) {
                        enemy.slowFactor = Math.min(enemy.slowFactor, Math.max(0.15, 1.0 - tdState.defenses.moat.slowPct));
                        const dps = tdState.defenses.moat.dps * dt;
                        enemy.hp -= dps;
                        if (Math.random() < 0.2) {
                            addParticles(enemy.x, enemy.y, "#38bdf8", 2);
                        }

                        // 🌊 随机溺亡判定 (概率受护城河等级影响)
                        const drownChance = (0.10 + moatLvl * 0.05) * dt;
                        if (Math.random() < drownChance) {
                            if (!enemy.isBoss && !enemy.isEnemyHero) {
                                enemy.hp = 0; // 敌兵直接呛水卷入急流溺亡
                                addFloatingText(enemy.x, enemy.y - 12, "🌊 急流漩涡溺亡!", "#38bdf8");
                                addParticles(enemy.x, enemy.y, "#0284c7", 15);
                            } else {
                                const drownDmg = 250 + moatLvl * 80;
                                enemy.hp -= drownDmg;
                                addFloatingText(enemy.x, enemy.y - 12, `🌊 狂涛溺伤 -${drownDmg}!`, "#0284c7");
                                addParticles(enemy.x, enemy.y, "#38bdf8", 12);
                            }
                        }
                    }
                }

                // ①b 隐蔽陷坑阵减速与刺戳伤 (非飞行敌军)
                const pitfallDef = tdState.defenses.pitfall;
                if (!enemy.isFly && pitfallDef && pitfallDef.level > 0 && pitfallDef.durability > 0) {
                    const pitfallY = castleY - 55;
                    if (enemy.y >= pitfallY - 8 && enemy.y <= pitfallY + 12) {
                        enemy.slowFactor = Math.min(enemy.slowFactor, Math.max(0.15, 1.0 - pitfallDef.slowPct));
                        const dps = pitfallDef.dps * dt;
                        const actualDmg = Math.min(enemy.hp, dps);
                        enemy.hp -= dps;
                        pitfallDef.durability -= actualDmg;

                        if (Math.random() < 0.15) {
                            addParticles(enemy.x, enemy.y, "#78350f", 2);
                        }

                        if (pitfallDef.durability <= 0) {
                            pitfallDef.durability = 0;
                            pitfallDef.level--;
                            addFloatingText(tdState.castle.width / 2 + tdState.castle.x, pitfallY, "🕳️ 隐蔽陷坑阵填满塌陷失效！", "#ea580c");
                            addParticles(tdState.castle.width / 2 + tdState.castle.x, pitfallY, "#78350f", 20);
                            if (pitfallDef.level > 0) {
                                pitfallDef.maxDurability = 800 * pitfallDef.level;
                                pitfallDef.durability = pitfallDef.maxDurability;
                            }
                        }
                    }
                }

                // 寻找攻击目标 (随机攻击城墙/英雄/士兵/箭塔；投石车专门攻击箭塔)
                const targetInfo = findEnemyTarget(enemy);

                if (enemy.isRanged) {
                    // 远程敌军 (敌弓箭手、敌投石车、远射魔将等)
                    if (targetInfo && enemy.attackCooldown <= 0) {
                        enemy.attackCooldown = enemy.rate || 1.4;
                        if (enemy.isCatapult) {
                            tdState.projectiles.push({
                                id: Math.random().toString(36).substr(2, 9),
                                type: 'enemyBoulder',
                                startX: enemy.x,
                                startY: enemy.y,
                                x: enemy.x,
                                y: enemy.y,
                                targetType: targetInfo.type,
                                targetObj: targetInfo.obj,
                                targetX: targetInfo.x,
                                targetY: targetInfo.y,
                                progress: 0,
                                speed: 1.0,
                                atk: enemy.atk
                            });
                        } else {
                            tdState.projectiles.push({
                                id: Math.random().toString(36).substr(2, 9),
                                type: 'enemyArrow',
                                x: enemy.x,
                                y: enemy.y,
                                targetType: targetInfo.type,
                                targetObj: targetInfo.obj,
                                targetX: targetInfo.x,
                                targetY: targetInfo.y,
                                speed: 220,
                                atk: enemy.atk
                            });
                        }
                    }
                    if (enemy.y < castleY - 55) {
                        enemy.y += enemy.speed * enemy.slowFactor * dt * 26;
                    }
                } else {
                    // 近战敌军
                    let engaged = false;
                    if (targetInfo && targetInfo.type === 'hero' && Math.hypot(targetInfo.x - enemy.x, targetInfo.y - enemy.y) < 28) {
                        engaged = true;
                        if (enemy.attackCooldown <= 0) {
                            enemy.attackCooldown = 1.0;
                            targetInfo.obj.hp -= enemy.atk;
                            addFloatingText(targetInfo.x, targetInfo.y - 10, `-${enemy.atk}`, "#f43f5e");
                            addParticles(targetInfo.x, targetInfo.y, "#ef4444", 4);
                            if (targetInfo.obj.hp <= 0) {
                                addFloatingText(targetInfo.x, targetInfo.y - 15, `💀 武将[${targetInfo.obj.name}]战死!`, "#ef4444");
                                addParticles(targetInfo.x, targetInfo.y, "#ef4444", 20);
                            }
                        }
                    }

                    if (!engaged) {
                        // ② 尖刺拒马阻挡与反弹伤害
                        if (!enemy.isFly && chevalActive && enemy.y >= chevalY - 5 && enemy.y <= chevalY + 5) {
                            enemy.y = chevalY - 5;
                            if (enemy.attackCooldown <= 0) {
                                enemy.attackCooldown = 1.0;
                                const dmg = enemy.atk;
                                tdState.defenses.chevalDeFrise.hp -= dmg;
                                const reflectDmg = tdState.defenses.chevalDeFrise.atk;
                                enemy.hp -= reflectDmg;
                                addFloatingText(enemy.x, enemy.y - 10, `-${reflectDmg}`, "#f97316");
                                addParticles(enemy.x, enemy.y, "#ea580c", 3);

                                if (tdState.defenses.chevalDeFrise.hp <= 0) {
                                    tdState.defenses.chevalDeFrise.hp = 0;
                                    addFloatingText(tdState.castle.width / 2, chevalY, "💥 尖刺拒马被摧毁！", "#f43f5e");
                                }
                            }
                        }
                        // ③ 抵达城墙墙根 -> 攻击箭塔或城墙 (箭塔 90% 超高闪避)
                        else if (enemy.y >= castleY - 12) {
                            enemy.y = castleY - 12;
                            if (enemy.attackCooldown <= 0) {
                                enemy.attackCooldown = 1.1;

                                // 铠甲科技减伤计算
                                const armor1Lvl = tdState.defenses.armor1 ? tdState.defenses.armor1.level : 0;
                                const armor2Lvl = tdState.defenses.armor2 ? tdState.defenses.armor2.level : 0;
                                const armorReduct = Math.min(0.60, armor1Lvl * 0.10 + armor2Lvl * 0.10);
                                const actualDmg = Math.max(1, Math.round(enemy.atk * (1 - armorReduct)));

                                if (targetInfo.type === 'tower' && targetInfo.obj.hp > 0) {
                                    if (Math.random() < 0.90) {
                                        addFloatingText(targetInfo.x, targetInfo.y - 12, "💨 箭塔闪避!", "#38bdf8");
                                        addParticles(targetInfo.x, targetInfo.y, "#38bdf8", 4);
                                    } else {
                                        targetInfo.obj.hp -= actualDmg;
                                        addFloatingText(targetInfo.x, targetInfo.y - 10, `-${actualDmg}`, "#f43f5e");
                                        if (targetInfo.obj.hp <= 0) {
                                            targetInfo.obj.hp = 0;
                                            targetInfo.obj.level = 0;
                                            addFloatingText(targetInfo.x, targetInfo.y - 15, `💥 [${targetInfo.obj.name}] 被摧毁!`, "#f43f5e");
                                        }
                                    }
                                } else if (targetInfo.type === 'wallArchers' && targetInfo.obj.hp > 0) {
                                    targetInfo.obj.hp -= actualDmg;
                                    addFloatingText(enemy.x, castleY - 20, `-${actualDmg}`, "#f43f5e");
                                    if (targetInfo.obj.hp <= 0) {
                                        targetInfo.obj.hp = 0;
                                        targetInfo.obj.level = 0;
                                        targetInfo.obj.count = 0;
                                        addFloatingText(tdState.castle.width / 2, castleY - 25, "💥 城墙弓箭队溃败！", "#f43f5e");
                                    }
                                } else {
                                    tdState.castle.hp -= actualDmg;
                                    addFloatingText(enemy.x, castleY - 20, `-${actualDmg}`, "#f43f5e");
                                    if (tdState.castle.hp <= 0) {
                                        tdState.castle.hp = 0;
                                        tdState.winner = 'defeat';
                                    }
                                }
                            }
                        } 
                        // ④ 正常向下推进
                        else {
                            enemy.y += enemy.speed * enemy.slowFactor * dt * 26;
                        }
                    }
                }

                // 检查敌军死亡
                if (enemy.hp <= 0) {
                    tdState.totalKills++;
                    addParticles(enemy.x, enemy.y, enemy.isEnemyHero ? "#ef4444" : (enemy.isBoss ? "#fde047" : "#ef4444"), enemy.isEnemyHero ? 25 : (enemy.isBoss ? 20 : 8));
                    addFloatingText(enemy.x, enemy.y - 10, enemy.isEnemyHero ? `💀 斩杀三国魔将[${enemy.name}]!` : `+10 💀`, enemy.isEnemyHero ? "#fde047" : "#10b981");

                    // 🌊 护城河填尸消失机制
                    const moatDef = tdState.defenses.moat;
                    if (!enemy.isFly && moatDef && moatDef.level > 0) {
                        const moatLvl = moatDef.level;
                        const moatHeight = 10 + moatLvl * 6;
                        const calcMoatY = castleY - 28 - moatHeight / 2;
                        if (enemy.y >= calcMoatY - 12 && enemy.y <= calcMoatY + moatHeight + 12) {
                            moatDef.corpses = (moatDef.corpses || 0) + 1;
                            const maxC = moatDef.maxCorpses || (10 * moatLvl);
                            addFloatingText(enemy.x, enemy.y - 18, `🌊 尸体填河 (${moatDef.corpses}/${maxC})`, "#0284c7");
                            if (moatDef.corpses >= maxC) {
                                moatDef.corpses = 0;
                                moatDef.level--;
                                addFloatingText(tdState.castle.width / 2 + tdState.castle.x, calcMoatY, "🌊 护城河已被敌军尸体填平陷落！", "#f43f5e");
                                addParticles(tdState.castle.width / 2 + tdState.castle.x, calcMoatY, "#0284c7", 25);
                                if (moatDef.level > 0) {
                                    moatDef.maxCorpses = 10 * moatDef.level;
                                }
                            }
                        }
                    }

                    tdState.enemies.splice(i, 1);
                }
            }

            // 3. 我方玩家三国神将技能与攻击
            for (let hIdx = tdState.playerHeroes.length - 1; hIdx >= 0; hIdx--) {
                let hero = tdState.playerHeroes[hIdx];
                if (hero.hp <= 0) {
                    tdState.playerHeroes.splice(hIdx, 1);
                    continue;
                }

                hero.timer += dt;
                if (hero.timer >= hero.rate) {
                    if (hero.type === 'archer') {
                        let target = null, minD = 9999;
                        for (let enemy of tdState.enemies) {
                            const d = Math.hypot(enemy.x - hero.x, enemy.y - hero.y);
                            if (d <= hero.range && d < minD) {
                                minD = d;
                                target = enemy;
                            }
                        }

                        if (target) {
                            hero.timer = 0;
                            if (hero.isAoE) {
                                tdState.projectiles.push({
                                    id: Math.random().toString(36).substr(2, 9),
                                    type: 'boulder',
                                    x: hero.x,
                                    y: hero.y - 10,
                                    startX: hero.x,
                                    startY: hero.y - 10,
                                    targetX: target.x,
                                    targetY: target.y,
                                    progress: 0,
                                    speed: 1.5,
                                    atk: hero.atk,
                                    aoeRadius: 45
                                });
                                addFloatingText(hero.x, hero.y - 15, `⚡ ${hero.name}`, hero.color);
                            } else {
                                tdState.projectiles.push({
                                    id: Math.random().toString(36).substr(2, 9),
                                    type: 'arrow',
                                    x: hero.x,
                                    y: hero.y - 10,
                                    targetX: target.x,
                                    targetY: target.y,
                                    targetId: target.id,
                                    speed: 300,
                                    atk: hero.atk
                                });
                            }
                        }
                    } else if (hero.type === 'melee') {
                        // 近战猛将出城迎敌斩杀
                        let target = null, minD = 9999;
                        for (let enemy of tdState.enemies) {
                            const d = Math.hypot(enemy.x - hero.x, enemy.y - hero.y);
                            if (d <= hero.range + 20 && d < minD) {
                                minD = d;
                                target = enemy;
                            }
                        }

                        if (target) {
                            hero.timer = 0;
                            target.hp -= hero.atk;
                            target.y = Math.max(20, target.y - 12); // 击退效果
                            addFloatingText(target.x, target.y - 12, `🗡️ ${hero.name}斩 -${hero.atk}!`, hero.color);
                            addParticles(target.x, target.y, hero.color, 10);
                        }
                    }
                }
            }

            // 3b. 我方防御塔自动射击机制
            const archeryLvl = tdState.defenses.archery ? tdState.defenses.archery.level : 0;
            const crossbowLvl = tdState.defenses.crossbow ? tdState.defenses.crossbow.level : 0;
            const archeryBonus = 1.0 + archeryLvl * 0.20 + crossbowLvl * 0.15;
            const rateMult = Math.max(0.65, 1.0 - crossbowLvl * 0.12);

            const trapsLvl = tdState.defenses.traps ? tdState.defenses.traps.level : 0;
            const trapBonus = 1.0 + trapsLvl * 0.25;

            const towers = [tdState.defenses.leftTower, tdState.defenses.centerTower, tdState.defenses.rightTower];
            for (let t of towers) {
                if (t.level <= 0 || t.hp <= 0) continue;
                t.timer += dt;
                if (t.timer >= (t.rate * rateMult)) {
                    let target = null, minD = 9999;
                    for (let enemy of tdState.enemies) {
                        const dist = Math.hypot(enemy.x - t.x, enemy.y - t.y);
                        if (dist <= t.range && dist < minD) {
                            minD = dist;
                            target = enemy;
                        }
                    }

                    if (target) {
                        t.timer = 0;
                        tdState.projectiles.push({
                            id: Math.random().toString(36).substr(2, 9),
                            type: 'arrow',
                            x: t.x,
                            y: t.y,
                            targetX: target.x,
                            targetY: target.y,
                            targetId: target.id,
                            speed: 260,
                            atk: Math.round(t.atk * archeryBonus)
                        });
                    }
                }
            }

            // 4. 城墙弓箭手小队齐射机制
            const archers = tdState.defenses.wallArchers;
            if (archers.level > 0 && archers.hp > 0 && archers.count > 0 && tdState.enemies.length > 0) {
                archers.timer += dt;
                if (archers.timer >= (archers.rate * rateMult)) {
                    archers.timer = 0;
                    for (let c = 0; c < archers.count; c++) {
                        const archerX = tdState.castle.x + 30 + (c * (tdState.castle.width - 60)) / Math.max(1, archers.count - 1);
                        const target = tdState.enemies[Math.floor(Math.random() * tdState.enemies.length)];
                        if (target) {
                            tdState.projectiles.push({
                                id: Math.random().toString(36).substr(2, 9),
                                type: 'arrow',
                                x: archerX,
                                y: tdState.castle.y - 5,
                                targetX: target.x,
                                targetY: target.y,
                                targetId: target.id,
                                speed: 250,
                                atk: Math.round(archers.atk * archeryBonus)
                            });
                        }
                    }
                }
            }

            // 5. 投石机发射烈焰巨石
            const catapult = tdState.defenses.catapult;
            if (catapult.level > 0 && tdState.enemies.length > 0) {
                catapult.timer += dt;
                if (catapult.timer >= catapult.rate) {
                    catapult.timer = 0;
                    const target = tdState.enemies[Math.floor(Math.random() * tdState.enemies.length)];
                    if (target) {
                        tdState.projectiles.push({
                            id: Math.random().toString(36).substr(2, 9),
                            type: 'boulder',
                            x: tdState.castle.x + tdState.castle.width / 2,
                            y: tdState.castle.y - 20,
                            startX: tdState.castle.x + tdState.castle.width / 2,
                            startY: tdState.castle.y - 20,
                            targetX: target.x,
                            targetY: target.y,
                            progress: 0,
                            speed: 1.2,
                            atk: Math.round(catapult.atk * trapBonus),
                            aoeRadius: 40 + catapult.level * 5
                        });
                        addParticles(tdState.castle.x + tdState.castle.width / 2, tdState.castle.y - 20, "#ea580c", 6);
                    }
                }
            }

            // 6. 床弩穿透重箭发射
            const ballista = tdState.defenses.ballista;
            if (ballista.level > 0 && tdState.enemies.length > 0) {
                ballista.timer += dt;
                if (ballista.timer >= ballista.rate) {
                    ballista.timer = 0;
                    const ballistaX = tdState.castle.x + 80;
                    tdState.projectiles.push({
                        id: Math.random().toString(36).substr(2, 9),
                        type: 'bolt',
                        x: ballistaX,
                        y: tdState.castle.y - 15,
                        vy: -280,
                        atk: Math.round(ballista.atk * trapBonus)
                    });
                    addParticles(ballistaX, tdState.castle.y - 15, "#cbd5e1", 8);
                }
            }

            // 7. 更新飞行投射物逻辑
            for (let pIdx = tdState.projectiles.length - 1; pIdx >= 0; pIdx--) {
                const p = tdState.projectiles[pIdx];

                if (p.type === 'arrow') {
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 8) {
                        for (let enemy of tdState.enemies) {
                            if (enemy.id === p.targetId || Math.hypot(enemy.x - p.x, enemy.y - p.y) < enemy.radius + 5) {
                                const realDmg = Math.round(p.atk * enemy.armor);
                                enemy.hp -= realDmg;
                                addFloatingText(enemy.x, enemy.y - 8, `-${realDmg}`, "#fbbf24");
                                addParticles(enemy.x, enemy.y, "#f97316", 3);
                                break;
                            }
                        }
                        tdState.projectiles.splice(pIdx, 1);
                    } else {
                        p.x += (dx / dist) * p.speed * dt;
                        p.y += (dy / dist) * p.speed * dt;
                    }
                } 
                else if (p.type === 'enemyArrow') {
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 8) {
                        const realDmg = p.atk;
                        if (p.targetType === 'hero' && p.targetObj && p.targetObj.hp > 0) {
                            p.targetObj.hp -= realDmg;
                            addFloatingText(p.targetObj.x, p.targetObj.y - 10, `-${realDmg}`, "#f43f5e");
                            if (p.targetObj.hp <= 0) {
                                addFloatingText(p.targetObj.x, p.targetObj.y - 15, `💀 武将[${p.targetObj.name}]战死!`, "#ef4444");
                                addParticles(p.targetObj.x, p.targetObj.y, "#ef4444", 20);
                            }
                        } else if (p.targetType === 'tower' && p.targetObj && p.targetObj.hp > 0) {
                            // 🛡️ 箭塔 90% 超高闪避率
                            if (Math.random() < 0.90) {
                                addFloatingText(p.targetObj.x, p.targetObj.y - 12, "💨 箭塔闪避!", "#38bdf8");
                                addParticles(p.targetObj.x, p.targetObj.y, "#38bdf8", 4);
                            } else {
                                p.targetObj.hp -= realDmg;
                                addFloatingText(p.targetObj.x, p.targetObj.y - 10, `-${realDmg}`, "#f43f5e");
                                if (p.targetObj.hp <= 0) {
                                    p.targetObj.hp = 0;
                                    p.targetObj.level = 0;
                                    addFloatingText(p.targetObj.x, p.targetObj.y - 15, `💥 [${p.targetObj.name}] 被摧毁!`, "#f43f5e");
                                }
                            }
                        } else if (p.targetType === 'wallArchers' && p.targetObj && p.targetObj.hp > 0) {
                            p.targetObj.hp -= realDmg;
                            addFloatingText(p.targetX, p.targetY - 10, `-${realDmg}`, "#f43f5e");
                            if (p.targetObj.hp <= 0) {
                                p.targetObj.hp = 0;
                                p.targetObj.level = 0;
                                p.targetObj.count = 0;
                                addFloatingText(tdState.castle.width / 2, tdState.castle.y - 25, "💥 城墙弓箭队溃败！", "#f43f5e");
                            }
                        } else {
                            tdState.castle.hp -= realDmg;
                            addFloatingText(p.targetX, p.targetY - 10, `-${realDmg}`, "#f43f5e");
                            if (tdState.castle.hp <= 0) {
                                tdState.castle.hp = 0;
                                tdState.winner = 'defeat';
                            }
                        }
                        tdState.projectiles.splice(pIdx, 1);
                    } else {
                        p.x += (dx / dist) * p.speed * dt;
                        p.y += (dy / dist) * p.speed * dt;
                    }
                }
                else if (p.type === 'enemyBoulder') {
                    p.progress += dt * p.speed;
                    p.x = p.startX + (p.targetX - p.startX) * p.progress;
                    p.y = p.startY + (p.targetY - p.startY) * p.progress - Math.sin(p.progress * Math.PI) * 48;

                    if (p.progress >= 1.0) {
                        addParticles(p.targetX, p.targetY, "#f97316", 20);

                        if (p.targetType === 'tower' && p.targetObj && p.targetObj.hp > 0) {
                            // 🛡️ 箭塔 90% 超高闪避率
                            if (Math.random() < 0.90) {
                                addFloatingText(p.targetObj.x, p.targetObj.y - 12, "💨 箭塔闪避巨石!", "#38bdf8");
                                addParticles(p.targetObj.x, p.targetObj.y, "#38bdf8", 5);
                            } else {
                                p.targetObj.hp -= p.atk;
                                addFloatingText(p.targetObj.x, p.targetObj.y - 10, `💥 -${p.atk}`, "#ef4444");
                                if (p.targetObj.hp <= 0) {
                                    p.targetObj.hp = 0;
                                    p.targetObj.level = 0;
                                    addFloatingText(p.targetObj.x, p.targetObj.y - 15, `💥 [${p.targetObj.name}] 被轰毁!`, "#f43f5e");
                                }
                            }
                        } else if (p.targetType === 'hero' && p.targetObj && p.targetObj.hp > 0) {
                            p.targetObj.hp -= p.atk;
                            addFloatingText(p.targetObj.x, p.targetObj.y - 10, `-${p.atk}`, "#f43f5e");
                            if (p.targetObj.hp <= 0) {
                                addFloatingText(p.targetObj.x, p.targetObj.y - 15, `💀 武将[${p.targetObj.name}]战死!`, "#ef4444");
                            }
                        } else if (p.targetType === 'wallArchers' && p.targetObj && p.targetObj.hp > 0) {
                            p.targetObj.hp -= p.atk;
                            addFloatingText(p.targetX, p.targetY - 10, `-${p.atk}`, "#f43f5e");
                            if (p.targetObj.hp <= 0) {
                                p.targetObj.hp = 0;
                                p.targetObj.level = 0;
                                p.targetObj.count = 0;
                                addFloatingText(tdState.castle.width / 2, tdState.castle.y - 25, "💥 城墙弓箭队溃败！", "#f43f5e");
                            }
                        } else {
                            tdState.castle.hp -= p.atk;
                            addFloatingText(p.targetX, p.targetY - 10, `-${p.atk}`, "#f43f5e");
                            if (tdState.castle.hp <= 0) {
                                tdState.castle.hp = 0;
                                tdState.winner = 'defeat';
                            }
                        }
                        tdState.projectiles.splice(pIdx, 1);
                    }
                }
                else if (p.type === 'boulder') {
                    p.progress += dt * p.speed;
                    p.x = p.startX + (p.targetX - p.startX) * p.progress;
                    p.y = p.startY + (p.targetY - p.startY) * p.progress - Math.sin(p.progress * Math.PI) * 45;

                    if (p.progress >= 1.0) {
                        addParticles(p.targetX, p.targetY, "#f97316", 25);
                        addFloatingText(p.targetX, p.targetY - 15, `💥 烈焰爆裂!`, "#ea580c");

                        for (let enemy of tdState.enemies) {
                            const d = Math.hypot(enemy.x - p.targetX, enemy.y - p.targetY);
                            if (d <= p.aoeRadius) {
                                enemy.hp -= p.atk;
                                addFloatingText(enemy.x, enemy.y - 10, `-${p.atk}!`, "#fde047");
                            }
                        }
                        tdState.projectiles.splice(pIdx, 1);
                    }
                }
                else if (p.type === 'bolt') {
                    p.y += p.vy * dt;
                    for (let enemy of tdState.enemies) {
                        if (Math.abs(enemy.x - p.x) < 18 && Math.abs(enemy.y - p.y) < 12) {
                            if (!p.hitIds) p.hitIds = new Set();
                            if (!p.hitIds.has(enemy.id)) {
                                p.hitIds.add(enemy.id);
                                enemy.hp -= p.atk;
                                addFloatingText(enemy.x, enemy.y - 10, `⚡穿透 -${p.atk}!`, "#38bdf8");
                                addParticles(enemy.x, enemy.y, "#38bdf8", 5);
                            }
                        }
                    }
                    if (p.y < 0) {
                        tdState.projectiles.splice(pIdx, 1);
                    }
                }
            }

            // 8. 更新作动滚木逻辑
            for (let lIdx = tdState.activeLogs.length - 1; lIdx >= 0; lIdx--) {
                const log = tdState.activeLogs[lIdx];
                log.y -= log.speed * dt;

                for (let enemy of tdState.enemies) {
                    if (!enemy.isFly && enemy.y >= log.y - 10 && enemy.y <= log.y + 15) {
                        if (!log.crushed) log.crushed = new Set();
                        if (!log.crushed.has(enemy.id)) {
                            log.crushed.add(enemy.id);
                            enemy.hp -= log.atk;
                            addFloatingText(enemy.x, enemy.y - 10, `🪵 滚木碾压 -${log.atk}!`, "#f97316");
                            addParticles(enemy.x, enemy.y, "#d97706", 8);
                        }
                    }
                }

                if (log.y < -30) {
                    tdState.activeLogs.splice(lIdx, 1);
                }
            }

            // 9. 更新热油/金汁火海
            for (let oIdx = tdState.oilSplashes.length - 1; oIdx >= 0; oIdx--) {
                const splash = tdState.oilSplashes[oIdx];
                splash.duration -= dt;

                for (let enemy of tdState.enemies) {
                    if (!enemy.isFly && enemy.y >= splash.y - 10 && enemy.y <= splash.y + splash.height + 5) {
                        enemy.hp -= splash.dps * dt;
                        if (Math.random() < 0.2) {
                            addParticles(enemy.x, enemy.y, "#eab308", 2);
                        }
                    }
                }

                if (splash.duration <= 0) {
                    tdState.oilSplashes.splice(oIdx, 1);
                }
            }

            // 10. 更新粒子与飘字
            for (let i = tdState.particles.length - 1; i >= 0; i--) {
                const p = tdState.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 1.8;
                if (p.life <= 0) tdState.particles.splice(i, 1);
            }

            for (let i = tdState.floatingTexts.length - 1; i >= 0; i--) {
                const ft = tdState.floatingTexts[i];
                ft.y -= 18 * dt;
                ft.life -= dt * 0.9;
                if (ft.life <= 0) tdState.floatingTexts.splice(i, 1);
            }

            updateBattleUI();
        }

        // 更新 UI 元素数值
        function updateBattleUI() {
            const castleHpText = document.getElementById('castleHpText');
            if (castleHpText) castleHpText.innerText = `${Math.round(tdState.castle.hp)}/${tdState.castle.maxHp}`;

            const castleHpBar = document.getElementById('castleHpBar');
            if (castleHpBar) {
                const pct = Math.max(0, (tdState.castle.hp / tdState.castle.maxHp) * 100);
                castleHpBar.style.width = pct + '%';
            }

            const buildProgressText = document.getElementById('buildProgressText');
            if (buildProgressText) buildProgressText.innerText = `${tdState.wordsProgress}/10 词`;

            const buildProgressBar = document.getElementById('buildProgressBar');
            if (buildProgressBar) {
                buildProgressBar.style.width = `${(tdState.wordsProgress / 10) * 100}%`;
            }

            const buildPointsBadge = document.getElementById('buildPointsBadge');
            if (buildPointsBadge) buildPointsBadge.innerText = `${tdState.buildPoints} 点`;

            const btnPointsText = document.getElementById('btnPointsText');
            if (btnPointsText) btnPointsText.innerText = tdState.buildPoints;

            const openBuildBtn = document.getElementById('openBuildBtn');
            if (openBuildBtn) {
                if (tdState.buildPoints > 0) {
                    openBuildBtn.style.animation = 'pulse 1.2s infinite';
                    openBuildBtn.style.borderColor = '#fde047';
                    openBuildBtn.style.background = 'linear-gradient(135deg, #f97316, #ea580c)';
                } else {
                    openBuildBtn.style.animation = 'none';
                    openBuildBtn.style.borderColor = '#334155';
                    openBuildBtn.style.background = '#1e293b';
                }
            }

            const enemyCountText = document.getElementById('enemyCountText');
            if (enemyCountText) enemyCountText.innerText = tdState.enemies.length;

            const killCountText = document.getElementById('killCountText');
            if (killCountText) killCountText.innerText = tdState.totalKills;

            const waveBadge = document.getElementById('waveBadge');
            if (waveBadge) waveBadge.innerText = `⏱️ 第 ${tdState.waveCount} 波敌军`;

            const moatStatusText = document.getElementById('moatStatusText');
            if (moatStatusText) {
                const moatLvl = tdState.defenses.moat.level;
                moatStatusText.innerText = moatLvl > 0 ? `Lv.${moatLvl} (减速${Math.round(tdState.defenses.moat.slowPct * 100)}%)` : '未建造';
            }

            // 渲染已解锁防御徽章
            const badgesEl = document.getElementById('activeDefenseBadges');
            if (badgesEl) {
                let badgeHtml = '';
                for (let k in tdState.defenses) {
                    const d = tdState.defenses[k];
                    if (d.level > 0 && (d.hp === undefined || d.hp > 0)) {
                        badgeHtml += `<span style="background:#1e293b; border:1px solid #f97316; padding:1px 6px; border-radius:8px; color:#fde047;">${d.icon} ${d.name.split(' ')[1] || d.name} Lv.${d.level}</span>`;
                    }
                }
                badgesEl.innerHTML = badgeHtml || `<span style="color:#64748b;">(背词获得建造点，解锁城墙防线)</span>`;
            }
        }

        // 渲染 Canvas 画面
        function renderTowerDefense() {
            if (!ctx || !canvas) return;

            const w = canvas.width;
            const h = canvas.height;

            // 1. 战场背景 (灰绿色大地)
            ctx.fillStyle = '#141e17';
            ctx.fillRect(0, 0, w, h);

            // 泥土路径纹理
            ctx.fillStyle = '#211d17';
            ctx.fillRect(w * 0.15, 0, w * 0.7, h);

            // 2. 护城河 (若已建造，等级越高越宽)
            const castleY = tdState.castle.y;

            // 2b. 隐蔽陷坑阵 (若已建造)
            const pitfallDef = tdState.defenses.pitfall;
            if (pitfallDef && pitfallDef.level > 0 && pitfallDef.durability > 0) {
                const pitfallY = castleY - 55;
                ctx.fillStyle = '#2d1b0e';
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 1;

                for (let x = 25; x < w - 25; x += 22) {
                    ctx.beginPath();
                    ctx.ellipse(x, pitfallY, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // 陷坑里的竹签尖刺
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(x - 1, pitfallY - 2, 2, 4);
                }

                ctx.fillStyle = '#fde047';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`🕳️ 陷坑阵 Lv.${pitfallDef.level} (耐久:${Math.ceil(pitfallDef.durability)}/${pitfallDef.maxDurability})`, 15, pitfallY - 5);
            }

            if (tdState.defenses.moat && tdState.defenses.moat.level > 0) {
                const moatDef = tdState.defenses.moat;
                const moatLvl = moatDef.level;
                const moatHeight = 10 + moatLvl * 6; // Lv1: 16px, Lv5: 40px
                const moatY = castleY - 28 - moatHeight / 2;
                const maxC = moatDef.maxCorpses || (10 * moatLvl);

                ctx.fillStyle = '#0284c7';
                ctx.fillRect(10, moatY, w - 20, moatHeight);

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(10, moatY, w - 20, moatHeight);

                // 水波纹效果
                ctx.beginPath();
                for (let x = 15; x < w - 20; x += 16) {
                    ctx.moveTo(x, moatY + moatHeight * 0.3);
                    ctx.lineTo(x + 8, moatY + moatHeight * 0.3);
                    if (moatHeight > 20) {
                        ctx.moveTo(x + 6, moatY + moatHeight * 0.7);
                        ctx.lineTo(x + 14, moatY + moatHeight * 0.7);
                    }
                }
                ctx.stroke();

                // 标识等级与容量/填尸进度
                ctx.fillStyle = '#e0f2fe';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`🌊 护城河 Lv.${moatLvl} (填尸:${moatDef.corpses || 0}/${maxC})`, w - 15, moatY + moatHeight - 2);
            }

            // 3. 尖刺拒马 (若已建造且未毁)
            if (tdState.defenses.chevalDeFrise.level > 0 && tdState.defenses.chevalDeFrise.hp > 0) {
                const chevalY = castleY - 20;
                ctx.fillStyle = '#78350f';
                for (let x = 20; x < w - 20; x += 16) {
                    ctx.beginPath();
                    ctx.moveTo(x, chevalY + 8);
                    ctx.lineTo(x + 5, chevalY - 6);
                    ctx.lineTo(x + 10, chevalY + 8);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(w / 2 - 25, chevalY - 12, 50, 3);
                ctx.fillStyle = '#ea580c';
                ctx.fillRect(w / 2 - 25, chevalY - 12, Math.max(0, (tdState.defenses.chevalDeFrise.hp / tdState.defenses.chevalDeFrise.maxHp) * 50), 3);
            }

            // 4. 热油火海
            for (let splash of tdState.oilSplashes) {
                ctx.fillStyle = 'rgba(234, 179, 8, 0.45)';
                ctx.fillRect(splash.x, splash.y, splash.width, splash.height);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 1;
                ctx.strokeRect(splash.x, splash.y, splash.width, splash.height);
            }

            // 5. 城堡城墙主体
            const castle = tdState.castle;
            ctx.fillStyle = '#334155';
            ctx.fillRect(castle.x, castle.y, castle.width, castle.height);

            // 垛口
            ctx.fillStyle = '#475569';
            const battlementWidth = 14;
            for (let x = castle.x; x < castle.x + castle.width; x += battlementWidth * 2) {
                ctx.fillRect(x, castle.y - 6, battlementWidth, 8);
            }

            // 6. 绘制防御塔 (左、中、右) 带有血条
            const towers = [tdState.defenses.leftTower, tdState.defenses.centerTower, tdState.defenses.rightTower];
            for (let t of towers) {
                if (t.level <= 0 || t.hp <= 0) continue;

                ctx.strokeStyle = 'rgba(249, 115, 22, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(t.x - 12, t.y - 12, 24, 20);
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.arc(t.x, t.y - 12, 12, Math.PI, Math.PI * 2);
                ctx.fill();

                // 箭塔血条
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(t.x - 12, t.y - 20, 24, 3);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(t.x - 12, t.y - 20, Math.max(0, (t.hp / t.maxHp) * 24), 3);

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🏹', t.x, t.y - 4);
            }

            // 7. 绘制城墙弓箭手小队 (与队血条)
            const archers = tdState.defenses.wallArchers;
            if (archers.level > 0 && archers.hp > 0 && archers.count > 0) {
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let c = 0; c < archers.count; c++) {
                    const ax = castle.x + 30 + (c * (castle.width - 60)) / Math.max(1, archers.count - 1);
                    ctx.fillText('🏹', ax, castle.y + 14);
                }
                // 小队整体血条
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(castle.x + 30, castle.y + 2, castle.width - 60, 3);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(castle.x + 30, castle.y + 2, Math.max(0, (archers.hp / archers.maxHp) * (castle.width - 60)), 3);
            }

            // 8. 绘制投石机与床弩
            if (tdState.defenses.catapult.level > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🪨', castle.x + castle.width / 2, castle.y + 12);
            }
            if (tdState.defenses.ballista.level > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🎯', castle.x + 80, castle.y + 12);
            }

            // 8b. 绘制我方三国神将 (近战出城战台，远程守卫城墙)
            for (let hero of tdState.playerHeroes) {
                if (hero.hp <= 0) continue;

                // 光环
                ctx.fillStyle = hero.color || '#38bdf8';
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(hero.x, hero.y, 13, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // 武将血条
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(hero.x - 12, hero.y - 16, 24, 3.5);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(hero.x - 12, hero.y - 16, Math.max(0, (hero.hp / hero.maxHp) * 24), 3.5);

                // 图标
                ctx.font = '15px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(hero.icon, hero.x, hero.y);

                // 名字与定位
                ctx.fillStyle = hero.type === 'melee' ? '#f97316' : '#fde047';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText(hero.name, hero.x, hero.y + 13);
            }

            // 9. 绘制敌军
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let enemy of tdState.enemies) {
                if (enemy.isEnemyHero) {
                    ctx.fillStyle = enemy.auraColor || '#ef4444';
                    ctx.globalAlpha = 0.35;
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;

                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(enemy.x - 14, enemy.y - 18, 28, 4);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(enemy.x - 14, enemy.y - 18, Math.max(0, (enemy.hp / enemy.maxHp) * 28), 4);

                    ctx.font = '16px sans-serif';
                    ctx.fillText(enemy.icon, enemy.x, enemy.y);

                    ctx.fillStyle = '#fca5a5';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.fillText(`魔·${enemy.name}`, enemy.x, enemy.y + 14);
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(enemy.x - 10, enemy.y - 14, 20, 3);
                    ctx.fillStyle = enemy.isBoss ? '#fde047' : '#f43f5e';
                    ctx.fillRect(enemy.x - 10, enemy.y - 14, Math.max(0, (enemy.hp / enemy.maxHp) * 20), 3);

                    ctx.font = enemy.isBoss ? '16px sans-serif' : '13px sans-serif';
                    ctx.fillText(enemy.icon, enemy.x, enemy.y);
                }
            }

            // 10. 绘制投射物 (玩家箭矢、敌军暗箭、巨石、床弩枪)
            for (let p of tdState.projectiles) {
                if (p.type === 'arrow') {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + (p.targetX - p.x) * 0.1, p.y + (p.targetY - p.y) * 0.1);
                    ctx.stroke();
                } else if (p.type === 'enemyArrow') {
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + (p.targetX - p.x) * 0.1, p.y + (p.targetY - p.y) * 0.1);
                    ctx.stroke();
                } else if (p.type === 'enemyBoulder') {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fca5a5';
                    ctx.stroke();
                } else if (p.type === 'boulder') {
                    ctx.fillStyle = '#ea580c';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'bolt') {
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x, p.y + 12);
                    ctx.stroke();
                }
            }

            // 11. 绘制作动滚木
            for (let log of tdState.activeLogs) {
                ctx.fillStyle = '#d97706';
                ctx.fillRect(log.x, log.y, log.width, 10);
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2;
                ctx.strokeRect(log.x, log.y, log.width, 10);
            }

            // 12. 绘制粒子
            for (let p of tdState.particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 13. 绘制飘字
            for (let ft of tdState.floatingTexts) {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1.0;

            // 14. 升级/招募中暂停状态横幅
            if (tdState.pausedByModal && !tdState.winner) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                ctx.fillRect(10, 8, w - 20, 24);
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 1;
                ctx.strokeRect(10, 8, w - 20, 24);

                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸️ 升级/招募中 — 战场已暂停', w / 2, 20);
            }

            // 15. 沦陷横幅
            if (tdState.winner === 'defeat') {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
                ctx.fillRect(0, 0, w, h);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillStyle = '#f43f5e';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('💀 城堡城墙沦陷！', w / 2, h / 2 - 12);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '12px sans-serif';
                ctx.fillText('多复习单词积累建造点，重修防线！', w / 2, h / 2 + 14);
            }
        }

        window.onload = async function() {
            await loadDynamicImages();
            initBattleGame();
            nextWord();
        };
    </script>
</body>
</html>
